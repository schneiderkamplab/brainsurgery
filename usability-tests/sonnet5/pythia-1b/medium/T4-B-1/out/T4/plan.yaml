inputs:
  - base::inputs/base/model.safetensors
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

transforms:
  - prefixes: { mode: add, alias: scratch }

  # --- Step 1: verify the shared-backbone precondition before touching anything ---

  # Same tensor count on all three checkpoints.
  - assert: { count: { of: 'base::.*', is: 244 } }
  - assert: { count: { of: 'ft1::.*', is: 244 } }
  - assert: { count: { of: 'ft2::.*', is: 244 } }

  # Exactly the expected 64 MLP tensors on each checkpoint.
  - assert:
      count:
        of: 'base::gpt_neox\.layers\.\d+\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)'
        is: 64
  - assert:
      count:
        of: 'ft1::gpt_neox\.layers\.\d+\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)'
        is: 64
  - assert:
      count:
        of: 'ft2::gpt_neox\.layers\.\d+\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)'
        is: 64

  # Every tensor outside the 64 MLP tensors must be identical (name, shape,
  # dtype, value) in ft1 and ft2 vs base. Transitively this makes all three
  # identical outside the MLP tensors. A missing/renamed tensor on either
  # side makes the mapped 'right' reference fail to resolve, which fails
  # this assertion too.
  - assert:
      equal:
        left: 'ft1::^(?!gpt_neox\.layers\.\d+\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)$)(.+)$'
        right: 'base::\1'
  - assert:
      equal:
        left: 'ft2::^(?!gpt_neox\.layers\.\d+\.mlp\.dense_(?:h_to_4h|4h_to_h)\.(?:weight|bias)$)(.+)$'
        right: 'base::\1'

  # --- Step 2: merge the two task vectors into the MLP tensors, in float32 ---
  # out = base + lambda*(ft1 - base) + lambda*(ft2 - base), lambda = 0.4

  - cast:
      from: 'base::gpt_neox\.layers\.(\d+)\.mlp\.dense_(h_to_4h|4h_to_h)\.(weight|bias)'
      to: 'scratch::base_f32.layers.\1.\2.\3'
      dtype: float32
  - cast:
      from: 'ft1::gpt_neox\.layers\.(\d+)\.mlp\.dense_(h_to_4h|4h_to_h)\.(weight|bias)'
      to: 'scratch::ft1_f32.layers.\1.\2.\3'
      dtype: float32
  - cast:
      from: 'ft2::gpt_neox\.layers\.(\d+)\.mlp\.dense_(h_to_4h|4h_to_h)\.(weight|bias)'
      to: 'scratch::ft2_f32.layers.\1.\2.\3'
      dtype: float32

  # delta1 = ft1_f32 - base_f32 (pre-create the slot with a copy, then overwrite)
  - copy:
      from: 'scratch::base_f32.layers.(\d+)\.(h_to_4h|4h_to_h)\.(weight|bias)'
      to: 'scratch::delta1.layers.\1.\2.\3'
  - subtract:
      from_a: 'scratch::ft1_f32.layers.(\d+)\.(h_to_4h|4h_to_h)\.(weight|bias)'
      from_b: 'scratch::base_f32.layers.\1.\2.\3'
      to: 'scratch::delta1.layers.\1.\2.\3'

  # delta2 = ft2_f32 - base_f32
  - copy:
      from: 'scratch::base_f32.layers.(\d+)\.(h_to_4h|4h_to_h)\.(weight|bias)'
      to: 'scratch::delta2.layers.\1.\2.\3'
  - subtract:
      from_a: 'scratch::ft2_f32.layers.(\d+)\.(h_to_4h|4h_to_h)\.(weight|bias)'
      from_b: 'scratch::base_f32.layers.\1.\2.\3'
      to: 'scratch::delta2.layers.\1.\2.\3'

  # scale both deltas by lambda = 0.4
  - scale:
      from: 'scratch::delta1.layers.(\d+)\.(h_to_4h|4h_to_h)\.(weight|bias)'
      to: 'scratch::delta1_scaled.layers.\1.\2.\3'
      by: 0.4
  - scale:
      from: 'scratch::delta2.layers.(\d+)\.(h_to_4h|4h_to_h)\.(weight|bias)'
      to: 'scratch::delta2_scaled.layers.\1.\2.\3'
      by: 0.4

  # accumulate into base_f32: base_f32 <- base_f32 + 0.4*delta1 + 0.4*delta2
  - add_:
      from: 'scratch::delta1_scaled.layers.(\d+)\.(h_to_4h|4h_to_h)\.(weight|bias)'
      to: 'scratch::base_f32.layers.\1.\2.\3'
  - add_:
      from: 'scratch::delta2_scaled.layers.(\d+)\.(h_to_4h|4h_to_h)\.(weight|bias)'
      to: 'scratch::base_f32.layers.\1.\2.\3'

  # cast the merged float32 result back down to float16 (the base dtype)
  - cast:
      from: 'scratch::base_f32.layers.(\d+)\.(h_to_4h|4h_to_h)\.(weight|bias)'
      to: 'scratch::merged_f16.layers.\1.\2.\3'
      dtype: float16

  # write the merged values into the base checkpoint in place; every other
  # base tensor is left untouched.
  - assign:
      from: 'scratch::merged_f16.layers.(\d+)\.(h_to_4h|4h_to_h)\.(weight|bias)'
      to: 'base::gpt_neox.layers.\1.mlp.dense_\2.\3'

  # --- Required checks ---
  - assert:
      count:
        of: 'scratch::merged_f16.layers.\d+\.(?:h_to_4h|4h_to_h)\.(?:weight|bias)'
        is: 64
  - assert: { count: { of: 'base::.*', is: 244 } }

  # Drop the scratch workspace so 'base' is the sole output-contributing
  # alias (output model must be inferable uniquely).
  - prefixes: { mode: remove, alias: scratch }

output:
  path: out/T4/model.safetensors
  format: safetensors
