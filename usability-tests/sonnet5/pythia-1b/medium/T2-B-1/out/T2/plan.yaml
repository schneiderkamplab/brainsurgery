  - assert: { shape: { of: 'gpt_neox.layers.0.attention.dense.weight', is: [2048, 2048] } }
  - assert: { count: { of: 'gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', is: 16 } }

