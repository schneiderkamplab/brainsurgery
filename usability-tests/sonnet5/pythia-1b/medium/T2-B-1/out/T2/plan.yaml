      to: 'gpt_neox.layers.0.attention.query_key_value.bias__pruned'
      dim: 0
  - concat:
      from:
        - 'gpt_neox.layers.0.attention.dense.weight::[:, 0:1280]'
        - 'gpt_neox.layers.0.attention.dense.weight::[:, 1536:2048]'
      to: 'gpt_neox.layers.0.attention.dense.weight__pruned'
      dim: 1
