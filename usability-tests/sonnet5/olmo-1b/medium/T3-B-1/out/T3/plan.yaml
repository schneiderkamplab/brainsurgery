inputs:
  - model::inputs/base

output:
  path: out/T3
  format: safetensors
  shard: "256MB"

transforms:
  # Preflight sanity: input has the expected tensor count.
  - assert: { count: { of: 'model::.*', is: 114 } }
  - assert: { dtype: { of: model::model.embed_tokens.weight, is: float32 } }
  - assert: { dtype: { of: model::lm_head.weight, is: float32 } }

  # Cast exactly the 112 projection matrices to bfloat16, in place. The
  # pattern matches self_attn.{q,k,v,o}_proj.weight and
  # mlp.{gate,up,down}_proj.weight for every layer, and nothing else
  # (embeddings, lm_head are untouched, no norms/biases exist in this
  # checkpoint).
  - cast_:
      target: 'model::model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))\.weight'
      to: bfloat16

  # Required checks: fail loudly before writing if anything is off.
  - assert:
      count:
        of: 'model::model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))\.weight'
        is: 112
  - assert:
      dtype:
        of: 'model::model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))\.weight'
        is: bfloat16
  - assert: { dtype: { of: model::model.layers.0.self_attn.q_proj.weight, is: bfloat16 } }
  - assert: { dtype: { of: model::model.embed_tokens.weight, is: float32 } }
  - assert: { dtype: { of: model::lm_head.weight, is: float32 } }
  - assert: { count: { of: 'model::.*', is: 114 } }
