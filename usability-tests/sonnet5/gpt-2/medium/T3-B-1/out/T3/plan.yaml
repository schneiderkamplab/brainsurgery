inputs:
  - model::inputs/base/model.safetensors

transforms:
  # 1. Cast exactly the 48 large projection matrices to bfloat16, in place.
  - cast_:
      target: 'h\.\d+\.(attn\.c_attn|attn\.c_proj|mlp\.c_fc|mlp\.c_proj)\.weight'
      to: bfloat16

  # 2. Drop the 12 non-parameter causal-mask buffers.
  - delete:
      target: 'h\.\d+\.attn\.bias'

  # Required checks: fail loudly before writing if any does not hold.
  - assert:
      count: { of: 'h\.\d+\.(attn\.c_attn|attn\.c_proj|mlp\.c_fc|mlp\.c_proj)\.weight', is: 48 }
  - assert:
      dtype: { of: 'h\.\d+\.(attn\.c_attn|attn\.c_proj|mlp\.c_fc|mlp\.c_proj)\.weight', is: bfloat16 }
  - assert:
      dtype: { of: h.0.attn.c_attn.weight, is: bfloat16 }
  - assert:
      dtype: { of: wte.weight, is: float32 }
  - assert:
      not: { exists: 'h\.\d+\.attn\.bias' }
  - assert:
      count: { of: '.*', is: 148 }

output:
  path: out/T3
  format: safetensors
  shard: 64MB
