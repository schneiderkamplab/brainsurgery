inputs:
  - model::inputs/base/model.safetensors

transforms:
  # Preflight: confirm the 12-layer starting point we expect.
  - assert: { count: { of: h\.\d+\.attn\.c_attn\.weight, is: 12 } }
  - assert: { count: { of: .*, is: 160 } }

  # 1. Remove every tensor of blocks 2, 5, 8 entirely.
  - delete: { target: h\.2\.(.+) }
  - delete: { target: h\.5\.(.+) }
  - delete: { target: h\.8\.(.+) }

  # 2. Renumber surviving blocks in ascending order of their old index, so
  #    each destination slot is already vacated (by a prior delete or a
  #    prior move in this same list) before we move into it:
  #    3->2, 4->3, 6->4, 7->5, 9->6, 10->7, 11->8. Blocks 0 and 1 keep their
  #    index and are left untouched.
  - move: { from: h\.3\.(.+), to: h.2.\1 }
  - move: { from: h\.4\.(.+), to: h.3.\1 }
  - move: { from: h\.6\.(.+), to: h.4.\1 }
  - move: { from: h\.7\.(.+), to: h.5.\1 }
  - move: { from: h\.9\.(.+), to: h.6.\1 }
  - move: { from: h\.10\.(.+), to: h.7.\1 }
  - move: { from: h\.11\.(.+), to: h.8.\1 }

  # Required checks: fail loudly if renumbering left stragglers or a
  # collision silently dropped tensors.
  - assert: { not: { exists: h\.9\.(.+) } }
  - assert: { not: { exists: h\.10\.(.+) } }
  - assert: { not: { exists: h\.11\.(.+) } }
  - assert: { count: { of: h\.\d+\.attn\.c_attn\.weight, is: 9 } }
  - assert: { count: { of: .*, is: 121 } }

  # Sanity: non-block tensors are untouched (still present, one each).
  - assert: { count: { of: wte\.weight, is: 1 } }
  - assert: { count: { of: wpe\.weight, is: 1 } }
  - assert: { count: { of: ln_f\.weight, is: 1 } }
  - assert: { count: { of: ln_f\.bias, is: 1 } }

output:
  path: out/T1/model.safetensors
  format: safetensors
