# T2 for GPT-2 (124M): remove attention head 5 from every layer.
# Each head-bearing tensor is rebuilt from the slices around the removed head.
# concat takes single tensor references only, so the per-layer concats are spelled out.
inputs:
  - model::inputs/base/model.safetensors
transforms:
  - copy: { from: 'h\.(\d+)\.attn\.c_attn\.weight::[:, 0:320]', to: 'h.\1.tmp_attn_c_attn_weight_0' }
  - copy: { from: 'h\.(\d+)\.attn\.c_attn\.weight::[:, 384:768]', to: 'h.\1.tmp_attn_c_attn_weight_1' }
  - copy: { from: 'h\.(\d+)\.attn\.c_attn\.weight::[:, 768:1088]', to: 'h.\1.tmp_attn_c_attn_weight_2' }
  - copy: { from: 'h\.(\d+)\.attn\.c_attn\.weight::[:, 1152:1536]', to: 'h.\1.tmp_attn_c_attn_weight_3' }
  - copy: { from: 'h\.(\d+)\.attn\.c_attn\.weight::[:, 1536:1856]', to: 'h.\1.tmp_attn_c_attn_weight_4' }
  - copy: { from: 'h\.(\d+)\.attn\.c_attn\.weight::[:, 1920:2304]', to: 'h.\1.tmp_attn_c_attn_weight_5' }
  - copy: { from: 'h\.(\d+)\.attn\.c_attn\.bias::[0:320]', to: 'h.\1.tmp_attn_c_attn_bias_0' }
  - copy: { from: 'h\.(\d+)\.attn\.c_attn\.bias::[384:768]', to: 'h.\1.tmp_attn_c_attn_bias_1' }
  - copy: { from: 'h\.(\d+)\.attn\.c_attn\.bias::[768:1088]', to: 'h.\1.tmp_attn_c_attn_bias_2' }
  - copy: { from: 'h\.(\d+)\.attn\.c_attn\.bias::[1152:1536]', to: 'h.\1.tmp_attn_c_attn_bias_3' }
  - copy: { from: 'h\.(\d+)\.attn\.c_attn\.bias::[1536:1856]', to: 'h.\1.tmp_attn_c_attn_bias_4' }
  - copy: { from: 'h\.(\d+)\.attn\.c_attn\.bias::[1920:2304]', to: 'h.\1.tmp_attn_c_attn_bias_5' }
  - copy: { from: 'h\.(\d+)\.attn\.c_proj\.weight::[0:320]', to: 'h.\1.tmp_attn_c_proj_weight_0' }
  - copy: { from: 'h\.(\d+)\.attn\.c_proj\.weight::[384:768]', to: 'h.\1.tmp_attn_c_proj_weight_1' }
