  - concat: { from: [h.1.tmp_attn_c_attn_weight_0, h.1.tmp_attn_c_attn_weight_1, h.1.tmp_attn_c_attn_weight_2, h.1.tmp_attn_c_attn_weight_3, h.1.tmp_attn_c_attn_weight_4, h.1.tmp_attn_c_attn_weight_5], to: h.1.attn.c_attn.weight, dim: 1 }
