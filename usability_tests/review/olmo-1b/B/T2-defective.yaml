# T2 for OLMo-1B-0724-hf: remove attention head 6 from every layer.
# Each head-bearing tensor is rebuilt from the slices around the removed head.
# concat takes single tensor references only, so the per-layer concats are spelled out.
inputs:
  - model::inputs/base
transforms:
  - copy: { from: 'model\.layers\.(\d+)\.self_attn\.q_proj\.weight::[0:768]', to: 'model.layers.\1.tmp_self_attn_q_proj_weight_0' }
  - copy: { from: 'model\.layers\.(\d+)\.self_attn\.q_proj\.weight::[896:2048]', to: 'model.layers.\1.tmp_self_attn_q_proj_weight_1' }
  - copy: { from: 'model\.layers\.(\d+)\.self_attn\.k_proj\.weight::[0:768]', to: 'model.layers.\1.tmp_self_attn_k_proj_weight_0' }
  - copy: { from: 'model\.layers\.(\d+)\.self_attn\.k_proj\.weight::[896:2048]', to: 'model.layers.\1.tmp_self_attn_k_proj_weight_1' }
  - copy: { from: 'model\.layers\.(\d+)\.self_attn\.v_proj\.weight::[0:768]', to: 'model.layers.\1.tmp_self_attn_v_proj_weight_0' }
  - copy: { from: 'model\.layers\.(\d+)\.self_attn\.v_proj\.weight::[896:2048]', to: 'model.layers.\1.tmp_self_attn_v_proj_weight_1' }
  - copy: { from: 'model\.layers\.(\d+)\.self_attn\.o_proj\.weight::[:, 0:768]', to: 'model.layers.\1.tmp_self_attn_o_proj_weight_0' }
  - copy: { from: 'model\.layers\.(\d+)\.self_attn\.o_proj\.weight::[:, 896:2048]', to: 'model.layers.\1.tmp_self_attn_o_proj_weight_1' }
  - delete: { target: 'model\.layers\.(\d+)\.(self_attn\.q_proj\.weight|self_attn\.k_proj\.weight|self_attn\.v_proj\.weight|self_attn\.o_proj\.weight)' }
  - concat: { from: [model.layers.0.tmp_self_attn_q_proj_weight_0, model.layers.0.tmp_self_attn_q_proj_weight_1], to: model.layers.0.self_attn.q_proj.weight, dim: 0 }
  - concat: { from: [model.layers.1.tmp_self_attn_q_proj_weight_0, model.layers.1.tmp_self_attn_q_proj_weight_1], to: model.layers.1.self_attn.q_proj.weight, dim: 0 }
  - concat: { from: [model.layers.2.tmp_self_attn_q_proj_weight_0, model.layers.2.tmp_self_attn_q_proj_weight_1], to: model.layers.2.self_attn.q_proj.weight, dim: 0 }
  - concat: { from: [model.layers.3.tmp_self_attn_q_proj_weight_0, model.layers.3.tmp_self_attn_q_proj_weight_1], to: model.layers.3.self_attn.q_proj.weight, dim: 0 }
