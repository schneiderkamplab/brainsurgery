inputs:
  - model::inputs/base

transforms:
  # sanity: full 16-layer input
  - assert: { count: { of: 'model\.layers\.\d+\.self_attn\.q_proj\.weight', is: 16 } }

  # 1. remove every tensor of blocks 2, 6, 10, 14
  - delete: { target: 'model\.layers\.(2|6|10|14)\..*' }

  # 2. renumber surviving blocks 0..15 (minus removed) into 0..11, contiguous.
  # Processed in increasing old-index order so each destination slot is free
  # (either deleted above, or vacated by an earlier move in this list) before
  # its move runs, avoiding any collision.
  - move: { from: 'model\.layers\.3\.(.*)', to: 'model.layers.2.\1' }
  - move: { from: 'model\.layers\.4\.(.*)', to: 'model.layers.3.\1' }
  - move: { from: 'model\.layers\.5\.(.*)', to: 'model.layers.4.\1' }
  - move: { from: 'model\.layers\.7\.(.*)', to: 'model.layers.5.\1' }
  - move: { from: 'model\.layers\.8\.(.*)', to: 'model.layers.6.\1' }
  - move: { from: 'model\.layers\.9\.(.*)', to: 'model.layers.7.\1' }
  - move: { from: 'model\.layers\.11\.(.*)', to: 'model.layers.8.\1' }
  - move: { from: 'model\.layers\.12\.(.*)', to: 'model.layers.9.\1' }
  - move: { from: 'model\.layers\.13\.(.*)', to: 'model.layers.10.\1' }
  - move: { from: 'model\.layers\.15\.(.*)', to: 'model.layers.11.\1' }
  # old 0 and old 1 keep their indices untouched.

  # Required checks
  - assert: { not: { any: [
        { exists: 'model\.layers\.12\..*' },
        { exists: 'model\.layers\.13\..*' },
        { exists: 'model\.layers\.14\..*' },
        { exists: 'model\.layers\.15\..*' },
      ] } }
  - assert: { count: { of: 'model\.layers\.\d+\.self_attn\.q_proj\.weight', is: 12 } }
  - assert: { count: { of: '.*', is: 86 } }

  # non-block tensors unchanged in name/shape
  - assert: { shape: { of: model.embed_tokens.weight, is: [50304, 2048] } }
  - assert: { shape: { of: lm_head.weight, is: [50304, 2048] } }

output:
  path: out/T1/model.safetensors
  format: safetensors
