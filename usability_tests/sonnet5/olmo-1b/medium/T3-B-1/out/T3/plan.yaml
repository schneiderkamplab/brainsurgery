inputs:
  - model::inputs/base

transforms:
  # Sanity: exactly 112 projection matrices exist and are float32 before casting.
  - assert: { count: { of: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight', is: 112 } }
  - assert: { dtype: { of: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight', is: float32 } }

  # Cast exactly the 112 projection matrices to bfloat16, in place (name-preserving).
  - cast_:
      target: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight'
      to: bfloat16

  # Required checks from TASK.md.
  - assert: { count: { of: '.*', is: 114 } }
  - assert:
      count:
        of: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight'
        is: 112
  - assert:
      all:
        - dtype: { of: 'model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)\.weight', is: bfloat16 }
        - dtype: { of: model.layers.0.self_attn.q_proj.weight, is: bfloat16 }
        - dtype: { of: model.embed_tokens.weight, is: float32 }
        - dtype: { of: lm_head.weight, is: float32 }

output:
  path: out/T3
  format: safetensors
  shard: 256MB
