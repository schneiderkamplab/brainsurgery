inputs:
  - model::inputs/base

transforms:
  # Preflight: base has the expected tensor count before any editing.
  - assert: { count: { of: 'model::.*', is: 114 } }
  - assert:
      shape:
        of: 'model::model.layers.0.self_attn.q_proj.weight'
        is: [2048, 2048]

  # Load the PEFT adapter into its own alias so it never mixes into the
  # output checkpoint unless explicitly merged.
  - load: { path: inputs/lora/adapter_model.safetensors, alias: lora }

  # Required check: exactly 32 adapter pairs (16 layers x {q_proj,v_proj}).
  - assert:
      count:
        of: 'lora::base_model\.model\.model\.layers\.\d+\.self_attn\.(q_proj|v_proj)\.lora_A\.weight'
        is: 32
  - assert:
      count:
        of: 'lora::base_model\.model\.model\.layers\.\d+\.self_attn\.(q_proj|v_proj)\.lora_B\.weight'
        is: 32

  # delta.<i>.<module> = lora_B @ lora_A, shape [2048, 2048], one per adapted
  # module (fan_in_fan_out = false, so no transposition is needed: base and
  # adapter factors share the [out, in] nn.Linear layout).
  - matmul:
      from_a: 'lora::base_model\.model\.model\.layers\.(\d+)\.self_attn\.(q_proj|v_proj)\.lora_B\.weight'
      from_b: 'lora::base_model.model.model.layers.\1.self_attn.\2.lora_A.weight'
      to: 'model::_delta.\1.\2.weight'

  # Confirms exactly 32 adapter pairs were actually merged into deltas.
  - assert: { count: { of: 'model::_delta\.\d+\.(q_proj|v_proj)\.weight', is: 32 } }

  # scale = lora_alpha / r = 32 / 16 = 2.
  - scale_:
      target: 'model::_delta\.(\d+)\.(q_proj|v_proj)\.weight'
      by: 2.0

  # Fold the scaled delta into the base weight in place.
  - add_:
      from: 'model::_delta\.(\d+)\.(q_proj|v_proj)\.weight'
      to: 'model::model.layers.\1.self_attn.\2.weight'

  # Drop the intermediate delta tensors so they never reach the output.
  - delete: { target: 'model::_delta\.\d+\.(q_proj|v_proj)\.weight' }

  # Drop every adapter tensor from the lora alias. Once it is empty, the
  # output alias is inferred unambiguously as "model".
  - delete: { target: 'lora::base_model\..*\.lora_[AB]\.weight' }

  # Required checks before writing the output.
  - assert: { not: { exists: 'model::.*lora_.*' } }
  - assert: { not: { exists: 'model::_delta.*' } }
  - assert:
      shape:
        of: 'model::model.layers.0.self_attn.q_proj.weight'
        is: [2048, 2048]
  - assert: { count: { of: 'model::.*', is: 114 } }

output:
  path: out/T5
  format: safetensors
  shard: "512MB"
