      to: model.layers.15.self_attn.k_proj.weight.pruned
      dim: 0
  - concat:
      from: [model.layers.15.self_attn.v_proj.weight.tmpa, model.layers.15.self_attn.v_proj.weight.tmpb]
      to: model.layers.15.self_attn.v_proj.weight.pruned
      dim: 0
  - concat:
