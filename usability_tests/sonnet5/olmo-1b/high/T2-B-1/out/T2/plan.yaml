      to: model.layers.15.self_attn.o_proj.weight.pruned
      dim: 1

  # --- Drop the temporaries, drop the originals, then move "pruned" onto
  #     the original names so tensor names are unchanged in the output. ---
  - delete: { target: 'model\.layers\.\d+\.self_attn\.(q_proj|k_proj|v_proj|o_proj)\.weight\.tmpa' }
  - delete: { target: 'model\.layers\.\d+\.self_attn\.(q_proj|k_proj|v_proj|o_proj)\.weight\.tmpb' }
  - delete: { target: 'model\.layers\.\d+\.self_attn\.(q_proj|k_proj|v_proj|o_proj)\.weight' }
  - move:
      from: 'model\.layers\.(\d+)\.self_attn\.(q_proj|k_proj|v_proj|o_proj)\.weight\.pruned'
      to: model.layers.\1.self_attn.\2.weight

  # --- Required checks (from TASK.md), plus the same checks generalized
  #     to every layer, not just layer 0. ---
  - assert:
      shape:
        of: 'model\.layers\.(\d+)\.self_attn\.(q_proj|k_proj|v_proj)\.weight'
        is: [1920, 2048]
  - assert:
      shape:
        of: 'model\.layers\.(\d+)\.self_attn\.o_proj\.weight'
        is: [2048, 1920]
  - assert:
      shape:
        of: model.layers.0.self_attn.q_proj.weight
        is: [1920, 2048]
  - assert:
      shape:
        of: model.layers.0.self_attn.k_proj.weight
        is: [1920, 2048]
  - assert:
      shape:
        of: model.layers.0.self_attn.v_proj.weight
        is: [1920, 2048]
  - assert:
      shape:
        of: model.layers.0.self_attn.o_proj.weight
        is: [2048, 1920]
  - assert: { count: { of: '.*', is: 114 } }

  # --- No stray temporaries/pruned names left behind. ---
  - assert: { not: { exists: '.*\.(tmpa|tmpb|pruned)$' } }
