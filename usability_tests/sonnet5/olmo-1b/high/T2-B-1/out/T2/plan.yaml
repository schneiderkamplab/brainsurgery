      dim: 0
  - concat:
      from: [model.layers.14.self_attn.k_proj.weight.tmpa, model.layers.14.self_attn.k_proj.weight.tmpb]
      to: model.layers.14.self_attn.k_proj.weight.pruned
      dim: 0
  - concat:
      from: [model.layers.14.self_attn.v_proj.weight.tmpa, model.layers.14.self_attn.v_proj.weight.tmpb]
      to: model.layers.14.self_attn.v_proj.weight.pruned
      dim: 0
  - concat:
      from: [model.layers.14.self_attn.o_proj.weight.tmpa, model.layers.14.self_attn.o_proj.weight.tmpb]
      to: model.layers.14.self_attn.o_proj.weight.pruned
      dim: 1
  - concat:
      from: [model.layers.15.self_attn.q_proj.weight.tmpa, model.layers.15.self_attn.q_proj.weight.tmpb]
      to: model.layers.15.self_attn.q_proj.weight.pruned
