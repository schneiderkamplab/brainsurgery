inputs:
  - model::inputs/base/model.safetensors

transforms:
  # 1. Drop the 48 non-parameter buffers (causal-mask bias, masked_bias, rotary inv_freq).
  - delete:
      target: 'gpt_neox\.layers\.\d+\.attention\.(bias|masked_bias|rotary_emb\.inv_freq)'

  # 2. Upcast everything that remains to float32 (embeddings, norms, biases, and the
  #    projection weights, which get downcast to bfloat16 in the next step).
  - cast_:
      target: '.*'
      to: float32

  # 3. Downcast exactly the 64 large projection matrices to bfloat16.
  - cast_:
      target: 'gpt_neox\.layers\.\d+\.(attention\.(query_key_value|dense)|mlp\.(dense_h_to_4h|dense_4h_to_h))\.weight'
      to: bfloat16

  # --- Required checks ---
  - assert:
      count:
        of: 'gpt_neox\.layers\.\d+\.(attention\.(query_key_value|dense)|mlp\.(dense_h_to_4h|dense_4h_to_h))\.weight'
        is: 64
  - assert:
      dtype:
        of: 'gpt_neox\.layers\.\d+\.(attention\.(query_key_value|dense)|mlp\.(dense_h_to_4h|dense_4h_to_h))\.weight'
        is: bfloat16
  - assert:
      dtype:
        of: gpt_neox.layers.0.attention.query_key_value.weight
        is: bfloat16
  - assert:
      dtype:
        of: gpt_neox.embed_in.weight
        is: float32
  - assert:
      not:
        exists: 'gpt_neox\.layers\.\d+\.attention\.(bias|masked_bias|rotary_emb\.inv_freq)'
  - assert:
      count:
        of: '.*'
        is: 196

output:
  path: out/T3
  format: safetensors
  shard: 256MB
