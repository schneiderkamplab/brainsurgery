inputs:
  - model::inputs/base/model.safetensors

transforms:
  # 1. Upcast everything to float32 first (embeddings, norms, biases, projection
  #    weights, and the buffers we are about to delete all go through this).
  - cast_: { target: '.*', to: float32 }

  # 2. Downcast exactly the 64 large projection matrices to bfloat16.
  - cast_:
      target: 'gpt_neox\.layers\.\d+\.(attention\.(query_key_value|dense)|mlp\.(dense_h_to_4h|dense_4h_to_h))\.weight'
      to: bfloat16

  # 3. Drop the non-parameter buffers (causal-mask bias, masked_bias scalar,
  #    rotary inv_freq). Parameters are never matched by this pattern.
  - delete:
      target: 'gpt_neox\.layers\.\d+\.attention\.(bias|masked_bias|rotary_emb\.inv_freq)'

  # --- Required checks ---
  - assert:
      count:
        of: 'gpt_neox\.layers\.\d+\.(attention\.(query_key_value|dense)|mlp\.(dense_h_to_4h|dense_4h_to_h))\.weight'
        is: 64
  - assert:
      dtype:
        of: 'gpt_neox\.layers\.\d+\.(attention\.(query_key_value|dense)|mlp\.(dense_h_to_4h|dense_4h_to_h))\.weight'
        is: bfloat16
  - assert:
      dtype: { of: gpt_neox.layers.0.attention.query_key_value.weight, is: bfloat16 }
  - assert:
      dtype: { of: gpt_neox.embed_in.weight, is: float32 }
  - assert:
      not:
        exists: 'gpt_neox\.layers\.\d+\.attention\.(bias|masked_bias|rotary_emb\.inv_freq)'
  - assert:
      count: { of: '.*', is: 196 }

output:
  path: out/T3
  format: safetensors
  shard: 256MB
