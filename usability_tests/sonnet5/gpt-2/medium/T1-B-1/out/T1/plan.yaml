inputs:
  - model::inputs/base/model.safetensors

output:
  path: out/T1/model.safetensors
  format: safetensors

transforms:
  # Preflight: confirm the 12-layer shape we expect before touching anything.
  - assert: { count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 12 } }
  - assert: { count: { of: '.*', is: 160 } }

  # Drop the three blocks being pruned, whole-block, all 13 tensors each.
  - delete: { target: ["h", "2", "*rest"] }
  - delete: { target: ["h", "5", "*rest"] }
  - delete: { target: ["h", "8", "*rest"] }

  # Renumber survivors down into the gaps, processed low-to-high old index so
  # each destination slot is already vacated (by an earlier delete or an
  # earlier move in this same list) before it is reused.
  - move: { from: ["h", "3", "*rest"], to: ["h", "2", "*rest"] }
  - move: { from: ["h", "4", "*rest"], to: ["h", "3", "*rest"] }
  - move: { from: ["h", "6", "*rest"], to: ["h", "4", "*rest"] }
  - move: { from: ["h", "7", "*rest"], to: ["h", "5", "*rest"] }
  - move: { from: ["h", "9", "*rest"], to: ["h", "6", "*rest"] }
  - move: { from: ["h", "10", "*rest"], to: ["h", "7", "*rest"] }
  - move: { from: ["h", "11", "*rest"], to: ["h", "8", "*rest"] }

  # Required checks: fail loudly if anything is off.
  - assert: { not: { exists: 'h\.(9|10|11)\..*' } }
  - assert: { count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 9 } }
  - assert: { count: { of: '.*', is: 121 } }

  # Non-block tensors must be untouched (still present, unrenamed).
  - assert: { exists: 'wte\.weight' }
  - assert: { exists: 'wpe\.weight' }
  - assert: { exists: 'ln_f\.weight' }
  - assert: { exists: 'ln_f\.bias' }
