inputs:
  - base::inputs/base/model.safetensors
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

transforms:
  # --- Step 1: verify preconditions before touching anything ---
  - assert: { count: { of: 'base::.*', is: 160 } }
  - assert: { count: { of: 'ft1::.*', is: 160 } }
  - assert: { count: { of: 'ft2::.*', is: 160 } }
  - assert: { count: { of: 'base::h\.\d+\.mlp\..*', is: 48 } }
  - assert: { count: { of: 'ft1::h\.\d+\.mlp\..*', is: 48 } }
  - assert: { count: { of: 'ft2::h\.\d+\.mlp\..*', is: 48 } }
  # every non-MLP tensor identical across base/ft1/ft2 (also proves the name
  # sets agree outside MLP, since 'equal' requires the destination to exist)
  - assert: { equal: { left: 'base::(?!h\.\d+\.mlp\.).*', right: 'ft1::\g<0>' } }
  - assert: { equal: { left: 'base::(?!h\.\d+\.mlp\.).*', right: 'ft2::\g<0>' } }

  # --- Step 2: task-vector merge of the 48 MLP tensors ---
  # diff1 = ft1 - base, diff2 = ft2 - base, each taken against the
  # unmodified base (both copies made before base is touched)
  - prefixes: { mode: add, alias: diff1 }
  - prefixes: { mode: add, alias: diff2 }
  - copy: { from: 'ft1::h\.\d+\.mlp\..*', to: 'diff1::\g<0>' }
  - copy: { from: 'ft2::h\.\d+\.mlp\..*', to: 'diff2::\g<0>' }
  - subtract_: { from: 'base::h\.\d+\.mlp\..*', to: 'diff1::\g<0>' }
  - subtract_: { from: 'base::h\.\d+\.mlp\..*', to: 'diff2::\g<0>' }
  - scale_: { target: 'diff1::h\.\d+\.mlp\..*', by: 0.4 }
  - scale_: { target: 'diff2::h\.\d+\.mlp\..*', by: 0.4 }
  - add_: { from: 'diff1::h\.\d+\.mlp\..*', to: 'base::\g<0>' }
  - add_: { from: 'diff2::h\.\d+\.mlp\..*', to: 'base::\g<0>' }

  # --- Step 3/4: sanity on result shape before writing, then write it ---
  - assert: { count: { of: 'base::.*', is: 160 } }
  - save: { path: out/T4/model.safetensors, alias: base, format: safetensors }
