inputs:
  - model::inputs/base/model.safetensors

output:
  path: out/T2/model.safetensors
  format: safetensors

transforms:
  # Preflight: confirm the fused/base shapes we assume before slicing.
  - assert: { shape: { of: 'h\.\d+\.attn\.c_attn\.weight', is: [768, 2304] } }
  - assert: { shape: { of: 'h\.\d+\.attn\.c_attn\.bias', is: [2304] } }
  - assert: { shape: { of: 'h\.\d+\.attn\.c_proj\.weight', is: [768, 768] } }
  - assert: { count: { of: '.*', is: 160 } }

  # --- layer 0: prune attention head 5 ---
  - concat: { from: ['h.0.attn.c_attn.weight::[:, :320]', 'h.0.attn.c_attn.weight::[:, 384:768]', 'h.0.attn.c_attn.weight::[:, 768:1088]', 'h.0.attn.c_attn.weight::[:, 1152:1536]', 'h.0.attn.c_attn.weight::[:, 1536:1856]', 'h.0.attn.c_attn.weight::[:, 1920:2304]'], to: h.0.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.0.attn.c_attn.bias::[:320]', 'h.0.attn.c_attn.bias::[384:768]', 'h.0.attn.c_attn.bias::[768:1088]', 'h.0.attn.c_attn.bias::[1152:1536]', 'h.0.attn.c_attn.bias::[1536:1856]', 'h.0.attn.c_attn.bias::[1920:2304]'], to: h.0.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.0.attn.c_proj.weight::[:320, :]', 'h.0.attn.c_proj.weight::[384:768, :]'], to: h.0.attn.c_proj.weight.pruned, dim: 0 }
  # --- layer 1: prune attention head 5 ---
  - concat: { from: ['h.1.attn.c_attn.weight::[:, :320]', 'h.1.attn.c_attn.weight::[:, 384:768]', 'h.1.attn.c_attn.weight::[:, 768:1088]', 'h.1.attn.c_attn.weight::[:, 1152:1536]', 'h.1.attn.c_attn.weight::[:, 1536:1856]', 'h.1.attn.c_attn.weight::[:, 1920:2304]'], to: h.1.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.1.attn.c_attn.bias::[:320]', 'h.1.attn.c_attn.bias::[384:768]', 'h.1.attn.c_attn.bias::[768:1088]', 'h.1.attn.c_attn.bias::[1152:1536]', 'h.1.attn.c_attn.bias::[1536:1856]', 'h.1.attn.c_attn.bias::[1920:2304]'], to: h.1.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.1.attn.c_proj.weight::[:320, :]', 'h.1.attn.c_proj.weight::[384:768, :]'], to: h.1.attn.c_proj.weight.pruned, dim: 0 }
  # --- layer 2: prune attention head 5 ---
  - concat: { from: ['h.2.attn.c_attn.weight::[:, :320]', 'h.2.attn.c_attn.weight::[:, 384:768]', 'h.2.attn.c_attn.weight::[:, 768:1088]', 'h.2.attn.c_attn.weight::[:, 1152:1536]', 'h.2.attn.c_attn.weight::[:, 1536:1856]', 'h.2.attn.c_attn.weight::[:, 1920:2304]'], to: h.2.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.2.attn.c_attn.bias::[:320]', 'h.2.attn.c_attn.bias::[384:768]', 'h.2.attn.c_attn.bias::[768:1088]', 'h.2.attn.c_attn.bias::[1152:1536]', 'h.2.attn.c_attn.bias::[1536:1856]', 'h.2.attn.c_attn.bias::[1920:2304]'], to: h.2.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.2.attn.c_proj.weight::[:320, :]', 'h.2.attn.c_proj.weight::[384:768, :]'], to: h.2.attn.c_proj.weight.pruned, dim: 0 }
  # --- layer 3: prune attention head 5 ---
  - concat: { from: ['h.3.attn.c_attn.weight::[:, :320]', 'h.3.attn.c_attn.weight::[:, 384:768]', 'h.3.attn.c_attn.weight::[:, 768:1088]', 'h.3.attn.c_attn.weight::[:, 1152:1536]', 'h.3.attn.c_attn.weight::[:, 1536:1856]', 'h.3.attn.c_attn.weight::[:, 1920:2304]'], to: h.3.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.3.attn.c_attn.bias::[:320]', 'h.3.attn.c_attn.bias::[384:768]', 'h.3.attn.c_attn.bias::[768:1088]', 'h.3.attn.c_attn.bias::[1152:1536]', 'h.3.attn.c_attn.bias::[1536:1856]', 'h.3.attn.c_attn.bias::[1920:2304]'], to: h.3.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.3.attn.c_proj.weight::[:320, :]', 'h.3.attn.c_proj.weight::[384:768, :]'], to: h.3.attn.c_proj.weight.pruned, dim: 0 }
  # --- layer 4: prune attention head 5 ---
  - concat: { from: ['h.4.attn.c_attn.weight::[:, :320]', 'h.4.attn.c_attn.weight::[:, 384:768]', 'h.4.attn.c_attn.weight::[:, 768:1088]', 'h.4.attn.c_attn.weight::[:, 1152:1536]', 'h.4.attn.c_attn.weight::[:, 1536:1856]', 'h.4.attn.c_attn.weight::[:, 1920:2304]'], to: h.4.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.4.attn.c_attn.bias::[:320]', 'h.4.attn.c_attn.bias::[384:768]', 'h.4.attn.c_attn.bias::[768:1088]', 'h.4.attn.c_attn.bias::[1152:1536]', 'h.4.attn.c_attn.bias::[1536:1856]', 'h.4.attn.c_attn.bias::[1920:2304]'], to: h.4.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.4.attn.c_proj.weight::[:320, :]', 'h.4.attn.c_proj.weight::[384:768, :]'], to: h.4.attn.c_proj.weight.pruned, dim: 0 }
  # --- layer 5: prune attention head 5 ---
  - concat: { from: ['h.5.attn.c_attn.weight::[:, :320]', 'h.5.attn.c_attn.weight::[:, 384:768]', 'h.5.attn.c_attn.weight::[:, 768:1088]', 'h.5.attn.c_attn.weight::[:, 1152:1536]', 'h.5.attn.c_attn.weight::[:, 1536:1856]', 'h.5.attn.c_attn.weight::[:, 1920:2304]'], to: h.5.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.5.attn.c_attn.bias::[:320]', 'h.5.attn.c_attn.bias::[384:768]', 'h.5.attn.c_attn.bias::[768:1088]', 'h.5.attn.c_attn.bias::[1152:1536]', 'h.5.attn.c_attn.bias::[1536:1856]', 'h.5.attn.c_attn.bias::[1920:2304]'], to: h.5.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.5.attn.c_proj.weight::[:320, :]', 'h.5.attn.c_proj.weight::[384:768, :]'], to: h.5.attn.c_proj.weight.pruned, dim: 0 }
  # --- layer 6: prune attention head 5 ---
  - concat: { from: ['h.6.attn.c_attn.weight::[:, :320]', 'h.6.attn.c_attn.weight::[:, 384:768]', 'h.6.attn.c_attn.weight::[:, 768:1088]', 'h.6.attn.c_attn.weight::[:, 1152:1536]', 'h.6.attn.c_attn.weight::[:, 1536:1856]', 'h.6.attn.c_attn.weight::[:, 1920:2304]'], to: h.6.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.6.attn.c_attn.bias::[:320]', 'h.6.attn.c_attn.bias::[384:768]', 'h.6.attn.c_attn.bias::[768:1088]', 'h.6.attn.c_attn.bias::[1152:1536]', 'h.6.attn.c_attn.bias::[1536:1856]', 'h.6.attn.c_attn.bias::[1920:2304]'], to: h.6.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.6.attn.c_proj.weight::[:320, :]', 'h.6.attn.c_proj.weight::[384:768, :]'], to: h.6.attn.c_proj.weight.pruned, dim: 0 }
  # --- layer 7: prune attention head 5 ---
  - concat: { from: ['h.7.attn.c_attn.weight::[:, :320]', 'h.7.attn.c_attn.weight::[:, 384:768]', 'h.7.attn.c_attn.weight::[:, 768:1088]', 'h.7.attn.c_attn.weight::[:, 1152:1536]', 'h.7.attn.c_attn.weight::[:, 1536:1856]', 'h.7.attn.c_attn.weight::[:, 1920:2304]'], to: h.7.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.7.attn.c_attn.bias::[:320]', 'h.7.attn.c_attn.bias::[384:768]', 'h.7.attn.c_attn.bias::[768:1088]', 'h.7.attn.c_attn.bias::[1152:1536]', 'h.7.attn.c_attn.bias::[1536:1856]', 'h.7.attn.c_attn.bias::[1920:2304]'], to: h.7.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.7.attn.c_proj.weight::[:320, :]', 'h.7.attn.c_proj.weight::[384:768, :]'], to: h.7.attn.c_proj.weight.pruned, dim: 0 }
  # --- layer 8: prune attention head 5 ---
  - concat: { from: ['h.8.attn.c_attn.weight::[:, :320]', 'h.8.attn.c_attn.weight::[:, 384:768]', 'h.8.attn.c_attn.weight::[:, 768:1088]', 'h.8.attn.c_attn.weight::[:, 1152:1536]', 'h.8.attn.c_attn.weight::[:, 1536:1856]', 'h.8.attn.c_attn.weight::[:, 1920:2304]'], to: h.8.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.8.attn.c_attn.bias::[:320]', 'h.8.attn.c_attn.bias::[384:768]', 'h.8.attn.c_attn.bias::[768:1088]', 'h.8.attn.c_attn.bias::[1152:1536]', 'h.8.attn.c_attn.bias::[1536:1856]', 'h.8.attn.c_attn.bias::[1920:2304]'], to: h.8.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.8.attn.c_proj.weight::[:320, :]', 'h.8.attn.c_proj.weight::[384:768, :]'], to: h.8.attn.c_proj.weight.pruned, dim: 0 }
  # --- layer 9: prune attention head 5 ---
  - concat: { from: ['h.9.attn.c_attn.weight::[:, :320]', 'h.9.attn.c_attn.weight::[:, 384:768]', 'h.9.attn.c_attn.weight::[:, 768:1088]', 'h.9.attn.c_attn.weight::[:, 1152:1536]', 'h.9.attn.c_attn.weight::[:, 1536:1856]', 'h.9.attn.c_attn.weight::[:, 1920:2304]'], to: h.9.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.9.attn.c_attn.bias::[:320]', 'h.9.attn.c_attn.bias::[384:768]', 'h.9.attn.c_attn.bias::[768:1088]', 'h.9.attn.c_attn.bias::[1152:1536]', 'h.9.attn.c_attn.bias::[1536:1856]', 'h.9.attn.c_attn.bias::[1920:2304]'], to: h.9.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.9.attn.c_proj.weight::[:320, :]', 'h.9.attn.c_proj.weight::[384:768, :]'], to: h.9.attn.c_proj.weight.pruned, dim: 0 }
  # --- layer 10: prune attention head 5 ---
  - concat: { from: ['h.10.attn.c_attn.weight::[:, :320]', 'h.10.attn.c_attn.weight::[:, 384:768]', 'h.10.attn.c_attn.weight::[:, 768:1088]', 'h.10.attn.c_attn.weight::[:, 1152:1536]', 'h.10.attn.c_attn.weight::[:, 1536:1856]', 'h.10.attn.c_attn.weight::[:, 1920:2304]'], to: h.10.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.10.attn.c_attn.bias::[:320]', 'h.10.attn.c_attn.bias::[384:768]', 'h.10.attn.c_attn.bias::[768:1088]', 'h.10.attn.c_attn.bias::[1152:1536]', 'h.10.attn.c_attn.bias::[1536:1856]', 'h.10.attn.c_attn.bias::[1920:2304]'], to: h.10.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.10.attn.c_proj.weight::[:320, :]', 'h.10.attn.c_proj.weight::[384:768, :]'], to: h.10.attn.c_proj.weight.pruned, dim: 0 }
  # --- layer 11: prune attention head 5 ---
  - concat: { from: ['h.11.attn.c_attn.weight::[:, :320]', 'h.11.attn.c_attn.weight::[:, 384:768]', 'h.11.attn.c_attn.weight::[:, 768:1088]', 'h.11.attn.c_attn.weight::[:, 1152:1536]', 'h.11.attn.c_attn.weight::[:, 1536:1856]', 'h.11.attn.c_attn.weight::[:, 1920:2304]'], to: h.11.attn.c_attn.weight.pruned, dim: 1 }
  - concat: { from: ['h.11.attn.c_attn.bias::[:320]', 'h.11.attn.c_attn.bias::[384:768]', 'h.11.attn.c_attn.bias::[768:1088]', 'h.11.attn.c_attn.bias::[1152:1536]', 'h.11.attn.c_attn.bias::[1536:1856]', 'h.11.attn.c_attn.bias::[1920:2304]'], to: h.11.attn.c_attn.bias.pruned, dim: 0 }
  - concat: { from: ['h.11.attn.c_proj.weight::[:320, :]', 'h.11.attn.c_proj.weight::[384:768, :]'], to: h.11.attn.c_proj.weight.pruned, dim: 0 }

  # Drop the original fused/projection tensors, then rename the pruned
  # replacements back onto the original names (tensor names do not change).
  - delete: { target: 'h\.\d+\.attn\.(c_attn\.weight|c_attn\.bias|c_proj\.weight)' }
  - move: { from: 'h\.(\d+)\.attn\.(c_attn\.weight|c_attn\.bias|c_proj\.weight)\.pruned', to: 'h.\1.attn.\2' }

  # Required checks.
  - assert: { shape: { of: h.0.attn.c_attn.weight, is: [768, 2112] } }
  - assert: { shape: { of: h.0.attn.c_attn.bias, is: [2112] } }
  - assert: { shape: { of: h.0.attn.c_proj.weight, is: [704, 768] } }
  - assert: { shape: { of: 'h\.\d+\.attn\.c_attn\.weight', is: [768, 2112] } }
  - assert: { shape: { of: 'h\.\d+\.attn\.c_attn\.bias', is: [2112] } }
  - assert: { shape: { of: 'h\.\d+\.attn\.c_proj\.weight', is: [704, 768] } }
  - assert: { count: { of: '.*', is: 160 } }
