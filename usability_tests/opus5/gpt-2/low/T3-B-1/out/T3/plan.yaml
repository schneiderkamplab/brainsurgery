inputs:
  - model::inputs/base/model.safetensors

transforms:
  # 1. Cast exactly the 48 projection matrices to bfloat16 (in place, names unchanged).
  - cast_:
      target: 'h\.\d+\.(attn\.(c_attn|c_proj)|mlp\.(c_fc|c_proj))\.weight'
      to: bfloat16

  # 2. Drop the 12 non-parameter causal-mask buffers.
  - delete:
      target: 'h\.\d+\.attn\.bias'

  # --- Required checks ---
  - assert:
      all:
        # exactly 48 tensors are bfloat16
        - count:
            of: 'h\.\d+\.(attn\.(c_attn|c_proj)|mlp\.(c_fc|c_proj))\.weight'
            is: 48
        - dtype:
            of: 'h\.\d+\.(attn\.(c_attn|c_proj)|mlp\.(c_fc|c_proj))\.weight'
            is: bfloat16
        # everything else stayed float32 (so no more than 48 are bfloat16)
        - dtype:
            of: '(?!h\.\d+\.(attn\.(c_attn|c_proj)|mlp\.(c_fc|c_proj))\.weight$).*'
            is: float32
        - dtype: { of: 'h\.0\.attn\.c_attn\.weight', is: bfloat16 }
        - dtype: { of: 'wte\.weight', is: float32 }
        # the output has exactly 148 tensors
        - count: { of: '.*', is: 148 }
        # the buffers are gone
        - not: { exists: 'h\.\d+\.attn\.bias' }

output:
  path: out/T3
  format: safetensors
  shard: 64MB
