  - move: { from: 'model::tmp_cattn_w_11', to: 'model::h.11.attn.c_attn.weight' }
  - move: { from: 'model::tmp_cattn_b_11', to: 'model::h.11.attn.c_attn.bias' }
  - move: { from: 'model::tmp_cproj_w_11', to: 'model::h.11.attn.c_proj.weight' }
  - assert:
      all:
        - shape: { of: 'model::h\.0\.attn\.c_attn\.weight', is: [768, 2112] }
        - shape: { of: 'model::h\.0\.attn\.c_attn\.bias', is: [2112] }
