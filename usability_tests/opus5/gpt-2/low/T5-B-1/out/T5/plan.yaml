inputs:
  - model::inputs/base/model.safetensors
  - lora::inputs/lora/adapter_model.safetensors

transforms:
  - assert:
      count: { of: 'lora::.*\.lora_A\.weight', is: 12 }
  - assert:
      count: { of: 'lora::.*\.lora_B\.weight', is: 12 }
  - matmul:
      from_a: 'lora::base_model.model.h.0.attn.c_attn.lora_B.weight'
      from_b: 'lora::base_model.model.h.0.attn.c_attn.lora_A.weight'
      to: 'model::tmpdelta.0.ba'
  - permute:
      from: 'model::tmpdelta.0.ba'
      to: 'model::tmpdelta.0.t'
      order: [1, 0]
  - scale_:
      target: 'model::tmpdelta.0.t'
      by: 2.0
  - add_:
      from: 'model::tmpdelta.0.t'
      to: 'model::h.0.attn.c_attn.weight'
  - matmul:
      from_a: 'lora::base_model.model.h.1.attn.c_attn.lora_B.weight'
      from_b: 'lora::base_model.model.h.1.attn.c_attn.lora_A.weight'
      to: 'model::tmpdelta.1.ba'
  - permute:
      from: 'model::tmpdelta.1.ba'
      to: 'model::tmpdelta.1.t'
      order: [1, 0]
  - scale_:
      target: 'model::tmpdelta.1.t'
      by: 2.0
  - add_:
      from: 'model::tmpdelta.1.t'
      to: 'model::h.1.attn.c_attn.weight'
  - matmul:
      from_a: 'lora::base_model.model.h.2.attn.c_attn.lora_B.weight'
      from_b: 'lora::base_model.model.h.2.attn.c_attn.lora_A.weight'
      to: 'model::tmpdelta.2.ba'
  - permute:
      from: 'model::tmpdelta.2.ba'
      to: 'model::tmpdelta.2.t'
      order: [1, 0]
  - scale_:
      target: 'model::tmpdelta.2.t'
      by: 2.0
  - add_:
      from: 'model::tmpdelta.2.t'
      to: 'model::h.2.attn.c_attn.weight'
  - matmul:
      from_a: 'lora::base_model.model.h.3.attn.c_attn.lora_B.weight'
      from_b: 'lora::base_model.model.h.3.attn.c_attn.lora_A.weight'
      to: 'model::tmpdelta.3.ba'
  - permute:
