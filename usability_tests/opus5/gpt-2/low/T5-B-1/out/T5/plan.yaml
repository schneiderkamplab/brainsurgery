  - permute:
      from: 'model::tmpdelta.11.ba'
      to: 'model::tmpdelta.11.t'
      order: [1, 0]
  - scale_:
      target: 'model::tmpdelta.11.t'
      by: 2.0
  - add_:
      from: 'model::tmpdelta.11.t'
      to: 'model::h.11.attn.c_attn.weight'
  - delete: { target: 'model::tmpdelta\..*' }
  - assert:
      not: { exists: 'model::.*lora_.*' }
  - assert:
      shape: { of: 'model::h.0.attn.c_attn.weight', is: [768, 2304] }
  - assert:
      count: { of: 'model::.*', is: 160 }

output:
  path: out/T5
  format: safetensors
  shard: 100MB
