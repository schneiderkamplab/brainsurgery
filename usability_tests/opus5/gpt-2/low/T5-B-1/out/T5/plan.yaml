  - matmul:
      from_a: 'lora::base_model.model.h.4.attn.c_attn.lora_B.weight'
      from_b: 'lora::base_model.model.h.4.attn.c_attn.lora_A.weight'
      to: 'model::tmpdelta.4.ba'
  - permute:
      from: 'model::tmpdelta.4.ba'
      to: 'model::tmpdelta.4.t'
      order: [1, 0]
  - scale_:
      target: 'model::tmpdelta.4.t'
      by: 2.0
  - add_:
      from: 'model::tmpdelta.4.t'
      to: 'model::h.4.attn.c_attn.weight'
  - matmul:
      from_a: 'lora::base_model.model.h.5.attn.c_attn.lora_B.weight'
      from_b: 'lora::base_model.model.h.5.attn.c_attn.lora_A.weight'
      to: 'model::tmpdelta.5.ba'
  - permute:
      from: 'model::tmpdelta.5.ba'
      to: 'model::tmpdelta.5.t'
      order: [1, 0]
  - scale_:
      target: 'model::tmpdelta.5.t'
      by: 2.0
  - add_:
      from: 'model::tmpdelta.5.t'
      to: 'model::h.5.attn.c_attn.weight'
  - matmul:
      from_a: 'lora::base_model.model.h.6.attn.c_attn.lora_B.weight'
      from_b: 'lora::base_model.model.h.6.attn.c_attn.lora_A.weight'
      to: 'model::tmpdelta.6.ba'
  - permute:
      from: 'model::tmpdelta.6.ba'
      to: 'model::tmpdelta.6.t'
      order: [1, 0]
  - scale_:
      target: 'model::tmpdelta.6.t'
      by: 2.0
  - add_:
      from: 'model::tmpdelta.6.t'
      to: 'model::h.6.attn.c_attn.weight'
  - matmul:
      from_a: 'lora::base_model.model.h.7.attn.c_attn.lora_B.weight'
      from_b: 'lora::base_model.model.h.7.attn.c_attn.lora_A.weight'
