      by: 2.0
  - add_:
      from: 'model::tmpdelta.9.t'
      to: 'model::h.9.attn.c_attn.weight'
  - matmul:
      from_a: 'lora::base_model.model.h.10.attn.c_attn.lora_B.weight'
      from_b: 'lora::base_model.model.h.10.attn.c_attn.lora_A.weight'
      to: 'model::tmpdelta.10.ba'
  - permute:
      from: 'model::tmpdelta.10.ba'
