        - 'model::h\.11\.attn\.c_attn\.weight::[:, :320]'
        - 'model::h\.11\.attn\.c_attn\.weight::[:, 384:768]'
        - 'model::h\.11\.attn\.c_attn\.weight::[:, 768:1088]'
        - 'model::h\.11\.attn\.c_attn\.weight::[:, 1152:1536]'
        - 'model::h\.11\.attn\.c_attn\.weight::[:, 1536:1856]'
        - 'model::h\.11\.attn\.c_attn\.weight::[:, 1920:2304]'
      to: 'model::pruned_c_attn_weight_11'
      dim: 1
  - concat:
      from:
        - 'model::h\.11\.attn\.c_attn\.bias::[:320]'
        - 'model::h\.11\.attn\.c_attn\.bias::[384:768]'
        - 'model::h\.11\.attn\.c_attn\.bias::[768:1088]'
        - 'model::h\.11\.attn\.c_attn\.bias::[1152:1536]'
        - 'model::h\.11\.attn\.c_attn\.bias::[1536:1856]'
        - 'model::h\.11\.attn\.c_attn\.bias::[1920:2304]'
      to: 'model::pruned_c_attn_bias_11'
      dim: 0
  - concat:
      from:
        - 'model::h\.11\.attn\.c_proj\.weight::[:320, :]'
        - 'model::h\.11\.attn\.c_proj\.weight::[384:768, :]'
      to: 'model::pruned_c_proj_weight_11'
      dim: 0
  - delete: { target: 'model::h\.11\.attn\.c_attn\.weight' }
  - delete: { target: 'model::h\.11\.attn\.c_attn\.bias' }
  - delete: { target: 'model::h\.11\.attn\.c_proj\.weight' }
  - move: { from: 'model::pruned_c_attn_weight_11', to: 'model::h.11.attn.c_attn.weight' }
  - move: { from: 'model::pruned_c_attn_bias_11', to: 'model::h.11.attn.c_attn.bias' }
  - move: { from: 'model::pruned_c_proj_weight_11', to: 'model::h.11.attn.c_proj.weight' }

  # ---- required checks (run before the checkpoint is written) ----
  - assert: { shape: { of: 'model::h\.0\.attn\.c_attn\.weight', is: [768, 2112] } }
  - assert: { shape: { of: 'model::h\.0\.attn\.c_attn\.bias', is: [2112] } }
  - assert: { shape: { of: 'model::h\.0\.attn\.c_proj\.weight', is: [704, 768] } }
  - assert: { count: { of: 'model::.*', is: 160 } }

  # ---- same checks over every layer, plus the tensors that must not have moved ----
  - assert: { shape: { of: 'model::h\.\d+\.attn\.c_attn\.weight', is: [768, 2112] } }
  - assert: { shape: { of: 'model::h\.\d+\.attn\.c_attn\.bias', is: [2112] } }
  - assert: { shape: { of: 'model::h\.\d+\.attn\.c_proj\.weight', is: [704, 768] } }
  - assert: { shape: { of: 'model::h\.\d+\.attn\.c_proj\.bias', is: [768] } }
  - assert: { shape: { of: 'model::h\.\d+\.attn\.bias', is: [1, 1, 1024, 1024] } }
  - assert: { count: { of: 'model::h\.\d+\.attn\.c_attn\.weight', is: 12 } }
  - assert: { count: { of: 'model::h\.\d+\.attn\.c_attn\.bias', is: 12 } }
  - assert: { count: { of: 'model::h\.\d+\.attn\.c_proj\.weight', is: 12 } }
  - assert: { not: { exists: 'model::pruned_.*' } }
  - assert: { dtype: { of: 'model::.*', is: float32 } }

output:
  path: out/T2/model.safetensors
  format: safetensors
