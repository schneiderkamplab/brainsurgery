# T2: structured attention-head pruning of GPT-2 (124M): drop head 5 in every layer.
#
# Layout facts used below (Conv1D, [in, out]):
#   h.<i>.attn.c_attn.weight [768, 2304] = fused [q | k | v] along dim 1.
#     Each 768-wide segment is 12 heads x 64 columns, so head 5 of q/k/v sits at
#     columns 320:384, 1088:1152 and 1856:1920. Keeping everything else, in order,
#     leaves 6 column blocks and a [768, 2112] tensor.
#   h.<i>.attn.c_attn.bias [2304] has the same block layout along dim 0.
#   h.<i>.attn.c_proj.weight [768, 768] consumes the heads on dim 0 (rows), so only
#     the single block 320:384 is dropped, leaving [704, 768].
#   attn.c_proj.bias and attn.bias are not per head and stay untouched.
#
# Each tensor is rebuilt by concatenating the kept slices into a scratch name, then
# the original is deleted and the scratch moved back onto the original name, so the
# tensor set and the names are unchanged.

inputs:
  - model::inputs/base/model.safetensors

transforms:
  # ---- layer 0 ----
  - concat:
      from:
        - 'model::h\.0\.attn\.c_attn\.weight::[:, :320]'
        - 'model::h\.0\.attn\.c_attn\.weight::[:, 384:768]'
        - 'model::h\.0\.attn\.c_attn\.weight::[:, 768:1088]'
        - 'model::h\.0\.attn\.c_attn\.weight::[:, 1152:1536]'
        - 'model::h\.0\.attn\.c_attn\.weight::[:, 1536:1856]'
        - 'model::h\.0\.attn\.c_attn\.weight::[:, 1920:2304]'
      to: 'model::pruned_c_attn_weight_0'
      dim: 1
  - concat:
      from:
        - 'model::h\.0\.attn\.c_attn\.bias::[:320]'
        - 'model::h\.0\.attn\.c_attn\.bias::[384:768]'
        - 'model::h\.0\.attn\.c_attn\.bias::[768:1088]'
        - 'model::h\.0\.attn\.c_attn\.bias::[1152:1536]'
        - 'model::h\.0\.attn\.c_attn\.bias::[1536:1856]'
        - 'model::h\.0\.attn\.c_attn\.bias::[1920:2304]'
      to: 'model::pruned_c_attn_bias_0'
      dim: 0
  - concat:
      from:
        - 'model::h\.0\.attn\.c_proj\.weight::[:320, :]'
        - 'model::h\.0\.attn\.c_proj\.weight::[384:768, :]'
      to: 'model::pruned_c_proj_weight_0'
      dim: 0
  - delete: { target: 'model::h\.0\.attn\.c_attn\.weight' }
  - delete: { target: 'model::h\.0\.attn\.c_attn\.bias' }
  - delete: { target: 'model::h\.0\.attn\.c_proj\.weight' }
  - move: { from: 'model::pruned_c_attn_weight_0', to: 'model::h.0.attn.c_attn.weight' }
  - move: { from: 'model::pruned_c_attn_bias_0', to: 'model::h.0.attn.c_attn.bias' }
  - move: { from: 'model::pruned_c_proj_weight_0', to: 'model::h.0.attn.c_proj.weight' }
  # ---- layer 1 ----
  - concat:
      from:
        - 'model::h\.1\.attn\.c_attn\.weight::[:, :320]'
        - 'model::h\.1\.attn\.c_attn\.weight::[:, 384:768]'
        - 'model::h\.1\.attn\.c_attn\.weight::[:, 768:1088]'
        - 'model::h\.1\.attn\.c_attn\.weight::[:, 1152:1536]'
        - 'model::h\.1\.attn\.c_attn\.weight::[:, 1536:1856]'
        - 'model::h\.1\.attn\.c_attn\.weight::[:, 1920:2304]'
      to: 'model::pruned_c_attn_weight_1'
