# T2: structured attention-head pruning of GPT-2 (124M): drop head 5 in every layer.
#
# Layout (Conv1D, [in, out]):
#   h.<i>.attn.c_attn.weight [768, 2304] = [q | k | v] along dim 1; head h of each
#     768-wide segment occupies columns 64*h .. 64*h+63. Head 5 -> columns
#     320..383 (q), 1088..1151 (k), 1856..1919 (v).
#   h.<i>.attn.c_attn.bias [2304] : same block layout along dim 0.
#   h.<i>.attn.c_proj.weight [768, 768] : heads are row blocks; head 5 -> rows 320..383.
#
# Each tensor is rebuilt with concat over the surviving blocks (in order), the
# original is deleted, and the rebuilt tensor is moved back under the original name.

inputs:
  - model::inputs/base/model.safetensors

transforms:
  # ---- layer 0 ----
  - concat:
      from:
        - 'h.0.attn.c_attn.weight::[:, 0:320]'
        - 'h.0.attn.c_attn.weight::[:, 384:768]'
        - 'h.0.attn.c_attn.weight::[:, 768:1088]'
        - 'h.0.attn.c_attn.weight::[:, 1152:1536]'
        - 'h.0.attn.c_attn.weight::[:, 1536:1856]'
        - 'h.0.attn.c_attn.weight::[:, 1920:2304]'
      to: pruned.0.attn.c_attn.weight
      dim: 1
  - concat:
      from:
        - 'h.0.attn.c_attn.bias::[0:320]'
        - 'h.0.attn.c_attn.bias::[384:768]'
        - 'h.0.attn.c_attn.bias::[768:1088]'
        - 'h.0.attn.c_attn.bias::[1152:1536]'
        - 'h.0.attn.c_attn.bias::[1536:1856]'
        - 'h.0.attn.c_attn.bias::[1920:2304]'
      to: pruned.0.attn.c_attn.bias
      dim: 0
  - concat:
      from:
        - 'h.0.attn.c_proj.weight::[0:320, :]'
        - 'h.0.attn.c_proj.weight::[384:768, :]'
      to: pruned.0.attn.c_proj.weight
      dim: 0
  - delete: { target: 'h\.0\.attn\.c_attn\.weight' }
  - delete: { target: 'h\.0\.attn\.c_attn\.bias' }
  - delete: { target: 'h\.0\.attn\.c_proj\.weight' }
  - move: { from: pruned.0.attn.c_attn.weight, to: h.0.attn.c_attn.weight }
  - move: { from: pruned.0.attn.c_attn.bias, to: h.0.attn.c_attn.bias }
  - move: { from: pruned.0.attn.c_proj.weight, to: h.0.attn.c_proj.weight }
  # ---- layer 1 ----
