  - move: { from: pruned.11.attn.c_attn.bias, to: h.11.attn.c_attn.bias }
  - move: { from: pruned.11.attn.c_proj.weight, to: h.11.attn.c_proj.weight }

  # ---- required checks ----
  - assert:
      all:
        - shape: { of: 'h\.0\.attn\.c_attn\.weight', is: [768, 2112] }
        - shape: { of: 'h\.0\.attn\.c_attn\.bias', is: [2112] }
        - shape: { of: 'h\.0\.attn\.c_proj\.weight', is: [704, 768] }
        - count: { of: '.*', is: 160 }
  # every layer, not just layer 0, plus proof that no scratch tensor survived
  - assert:
      all:
        - count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 12 }
        - count: { of: 'h\.\d+\.attn\.c_attn\.bias', is: 12 }
        - count: { of: 'h\.\d+\.attn\.c_proj\.weight', is: 12 }
        - not: { exists: 'pruned\..*' }
        - shape: { of: 'h\.\d+\.attn\.c_attn\.weight', is: [768, 2112] }
        - shape: { of: 'h\.\d+\.attn\.c_attn\.bias', is: [2112] }
        - shape: { of: 'h\.\d+\.attn\.c_proj\.weight', is: [704, 768] }
        - shape: { of: 'h\.\d+\.attn\.c_proj\.bias', is: [768] }
        - shape: { of: 'h\.\d+\.attn\.bias', is: [1, 1, 1024, 1024] }
        - dtype: { of: '.*', is: float32 }

output:
  path: out/T2/model.safetensors
  format: safetensors
