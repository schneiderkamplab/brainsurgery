transforms:
- assert:
    count:
      of: base::.*
      is: 114
- assert:
    count:
      of: ft1::.*
      is: 114
- assert:
    count:
      of: ft2::.*
      is: 114
- assert:
    count:
      of: base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    count:
      of: ft1::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    count:
      of: ft2::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    equal:
      left: base::(?!model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight$).+
      right: ft1::\g<0>
- assert:
    equal:
      left: base::(?!model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight$).+
      right: ft2::\g<0>
- assert:
    shape:
      of: ft1::model\.layers\.\d+\.mlp\.(gate_proj|up_proj)\.weight
      is:
      - 8192
      - 2048
- assert:
    shape:
      of: ft2::model\.layers\.\d+\.mlp\.(gate_proj|up_proj)\.weight
      is:
      - 8192
      - 2048
- assert:
    shape:
      of: ft1::model\.layers\.\d+\.mlp\.down_proj\.weight
      is:
      - 2048
      - 8192
- assert:
    shape:
      of: ft2::model\.layers\.\d+\.mlp\.down_proj\.weight
      is:
      - 2048
      - 8192
- assert:
    dtype:
      of: base::.*
      is: float32
- assert:
    dtype:
      of: ft1::.*
      is: float32
- assert:
    dtype:
      of: ft2::.*
      is: float32
- copy:
    from: ft1::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
    to: base::tv1.\g<0>
- subtract_:
    from: base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
    to: base::tv1.\g<0>
- copy:
    from: ft2::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
    to: base::tv2.\g<0>
- subtract_:
    from: base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
    to: base::tv2.\g<0>
- assert:
    count:
      of: base::tv1\..*
      is: 48
- assert:
    count:
      of: base::tv2\..*
      is: 48
- assert:
    dtype:
      of: base::tv[12]\..*
      is: float32
- scale_:
    target: base::tv1\..*
    by: 0.4
- scale_:
    target: base::tv2\..*
    by: 0.4
- add_:
    from: base::tv1\.(.+)
    to: base::\1
- add_:
    from: base::tv2\.(.+)
    to: base::\1
- delete:
    target: base::tv[12]\..*
- assert:
    not:
      exists: base::tv[12]\..*
- assert:
    count:
      of: base::.*
      is: 114
- assert:
    count:
      of: base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    dtype:
      of: base::.*
      is: float32
- assert:
    equal:
      left: base::(?!model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight$).+
      right: ft1::\g<0>
