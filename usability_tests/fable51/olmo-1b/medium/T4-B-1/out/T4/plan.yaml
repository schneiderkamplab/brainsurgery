# T4: task-vector merge of two fine-tunes into the OLMo-1B base (lambda = 0.4).
# All writes go to the `base` alias so it is the output model.
inputs:
  - base::inputs/base
  - ft1::inputs/ft1/model.safetensors
  - ft2::inputs/ft2/model.safetensors

transforms:
  # ---- Step 1: verify layout and shared tensors before touching anything ----
  # Same tensor count in all three checkpoints.
  - assert: { count: { of: 'base::.*', is: 114 } }
  - assert: { count: { of: 'ft1::.*', is: 114 } }
  - assert: { count: { of: 'ft2::.*', is: 114 } }
  # Exactly 48 MLP tensors in each checkpoint.
  - assert: { count: { of: 'base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  - assert: { count: { of: 'ft1::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  - assert: { count: { of: 'ft2::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  # Every non-MLP tensor of base exists in ft1 and ft2 with identical shape, dtype and values.
  # Together with the counts above, this proves the three name sets are identical.
  - assert:
      equal:
        left: 'base::(?!model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight$).+'
        right: 'ft1::\g<0>'
  - assert:
      equal:
        left: 'base::(?!model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight$).+'
        right: 'ft2::\g<0>'
  # MLP tensors must exist under the same names in ft1/ft2 with matching shape and dtype.
  - assert: { shape: { of: 'ft1::model\.layers\.\d+\.mlp\.(gate_proj|up_proj)\.weight', is: [8192, 2048] } }
  - assert: { shape: { of: 'ft2::model\.layers\.\d+\.mlp\.(gate_proj|up_proj)\.weight', is: [8192, 2048] } }
  - assert: { shape: { of: 'ft1::model\.layers\.\d+\.mlp\.down_proj\.weight', is: [2048, 8192] } }
  - assert: { shape: { of: 'ft2::model\.layers\.\d+\.mlp\.down_proj\.weight', is: [2048, 8192] } }
  - assert: { dtype: { of: 'base::.*', is: float32 } }
  - assert: { dtype: { of: 'ft1::.*', is: float32 } }
  - assert: { dtype: { of: 'ft2::.*', is: float32 } }

  # ---- Step 2: task vectors, both taken against the UNMODIFIED base ----
  # tv1.<X> = ft1[X] - base[X]
  - copy:      { from: 'ft1::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight', to: 'base::tv1.\g<0>' }
  - subtract_: { from: 'base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight', to: 'base::tv1.\g<0>' }
  # tv2.<X> = ft2[X] - base[X]
  - copy:      { from: 'ft2::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight', to: 'base::tv2.\g<0>' }
  - subtract_: { from: 'base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight', to: 'base::tv2.\g<0>' }
  # Exactly 48 task-vector tensors per fine-tune (= exactly 48 tensors to merge).
  - assert: { count: { of: 'base::tv1\..*', is: 48 } }
  - assert: { count: { of: 'base::tv2\..*', is: 48 } }
  - assert: { dtype: { of: 'base::tv[12]\..*', is: float32 } }

  # Scale by lambda and add into the base (only now is the base modified).
  - scale_: { target: 'base::tv1\..*', by: 0.4 }
  - scale_: { target: 'base::tv2\..*', by: 0.4 }
  - add_: { from: 'base::tv1\.(.+)', to: 'base::\1' }
  - add_: { from: 'base::tv2\.(.+)', to: 'base::\1' }

  # ---- Step 3: clean up and final checks ----
  - delete: { target: 'base::tv[12]\..*' }
  - assert: { not: { exists: 'base::tv[12]\..*' } }
  - assert: { count: { of: 'base::.*', is: 114 } }
  - assert: { count: { of: 'base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight', is: 48 } }
  - assert: { dtype: { of: 'base::.*', is: float32 } }
  # Non-MLP tensors are still bit-identical to the base as loaded from ft1 (== original base).
  - assert:
      equal:
        left: 'base::(?!model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight$).+'
        right: 'ft1::\g<0>'

output:
  path: out/T4/model.safetensors
  format: safetensors
