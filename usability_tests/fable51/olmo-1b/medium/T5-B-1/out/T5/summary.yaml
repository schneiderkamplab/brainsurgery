transforms:
- assert:
    count:
      of: lora::base_model\.model\.model\.layers\.\d+\.self_attn\.[qv]_proj\.lora_A\.weight
      is: 32
- assert:
    count:
      of: lora::base_model\.model\.model\.layers\.\d+\.self_attn\.[qv]_proj\.lora_B\.weight
      is: 32
- assert:
    count:
      of: lora::.*
      is: 64
- assert:
    count:
      of: base::model\.layers\.\d+\.self_attn\.[qv]_proj\.weight
      is: 32
- assert:
    count:
      of: base::.*
      is: 114
- assert:
    shape:
      of: lora::base_model\.model\.model\.layers\.\d+\.self_attn\.[qv]_proj\.lora_A\.weight
      is:
      - 16
      - 2048
- assert:
    shape:
      of: lora::base_model\.model\.model\.layers\.\d+\.self_attn\.[qv]_proj\.lora_B\.weight
      is:
      - 2048
      - 16
- assert:
    dtype:
      of: lora::.*
      is: float32
- matmul:
    from_a: lora::base_model\.model\.(model\.layers\.\d+\.self_attn\.[qv]_proj)\.lora_B\.weight
    from_b: lora::base_model.model.\1.lora_A.weight
    to: base::__delta.\1
- assert:
    count:
      of: base::__delta\..*
      is: 32
- assert:
    shape:
      of: base::__delta\..*
      is:
      - 2048
      - 2048
- assert:
    dtype:
      of: base::__delta\..*
      is: float32
- scale_:
    target: base::__delta\..*
    by: 2.0
- add_:
    from: base::__delta\.(model\.layers\.\d+\.self_attn\.[qv]_proj)
    to: base::\1.weight
- delete:
    target: base::__delta\..*
- assert:
    not:
      exists: base::.*lora_.*
- assert:
    not:
      exists: base::__delta.*
- assert:
    shape:
      of: base::model\.layers\.0\.self_attn\.q_proj\.weight
      is:
      - 2048
      - 2048
- assert:
    dtype:
      of: base::model\.layers\.\d+\.self_attn\.[qv]_proj\.weight
      is: float32
- assert:
    count:
      of: base::.*
      is: 114
