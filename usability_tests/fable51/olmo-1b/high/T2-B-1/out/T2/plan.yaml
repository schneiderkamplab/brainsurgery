# T2: remove attention head 5 (rows/cols 640..767) from every layer of OLMo-1B-0724-hf.
inputs:
  - model::inputs/base

output:
  path: out/T2/model.safetensors
  format: safetensors

transforms:
  # Preflight: 16 layers x 4 head-bearing projections, all [2048, 2048], 114 tensors in total.
  - assert: { count: { of: '.*', is: 114 } }
  - assert: { count: { of: 'model\.layers\.\d+\.self_attn\.[qkvo]_proj\.weight', is: 64 } }
  - assert: { shape: { of: 'model\.layers\.0\.self_attn\.q_proj\.weight', is: [2048, 2048] } }
  - assert: { shape: { of: 'model\.layers\.0\.self_attn\.o_proj\.weight', is: [2048, 2048] } }

  # Rebuild each projection without head 5 into a temporary name.
  # q/k/v: heads are row blocks (dim 0); o: heads are column blocks (dim 1).
  - concat: { from: ['model\.layers\.0\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.0\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.0.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.0\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.0\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.0.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.0\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.0\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.0.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.0\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.0\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.0.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.1\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.1\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.1.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.1\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.1\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.1.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.1\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.1\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.1.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.1\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.1\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.1.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.2\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.2\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.2.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.2\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.2\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.2.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.2\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.2\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.2.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.2\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.2\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.2.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.3\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.3\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.3.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.3\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.3\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.3.self_attn.k_proj.pruned, dim: 0 }
