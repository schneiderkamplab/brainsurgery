  - concat: { from: ['model\.layers\.15\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.15\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.15.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.15\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.15\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.15.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.15\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.15\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.15.self_attn.o_proj.pruned, dim: 1 }

  # Replace the originals with the pruned tensors under the original names.
  - assert: { count: { of: 'model\.layers\.\d+\.self_attn\.[qkvo]_proj\.pruned', is: 64 } }
  - delete: { target: 'model\.layers\.\d+\.self_attn\.[qkvo]_proj\.weight' }
  - move:
      from: 'model\.layers\.(\d+)\.self_attn\.([qkvo])_proj\.pruned'
      to: 'model.layers.\1.self_attn.\2_proj.weight'

  # Required checks.
  - assert: { shape: { of: 'model\.layers\.0\.self_attn\.q_proj\.weight', is: [1920, 2048] } }
  - assert: { shape: { of: 'model\.layers\.0\.self_attn\.k_proj\.weight', is: [1920, 2048] } }
  - assert: { shape: { of: 'model\.layers\.0\.self_attn\.v_proj\.weight', is: [1920, 2048] } }
  - assert: { shape: { of: 'model\.layers\.0\.self_attn\.o_proj\.weight', is: [2048, 1920] } }
  - assert: { count: { of: '.*', is: 114 } }
  # Extra: no leftover temporaries, and every layer got the new shapes.
  - assert: { not: { exists: '.*\.pruned' } }
  - assert: { count: { of: 'model\.layers\.\d+\.self_attn\.[qkv]_proj\.weight', is: 48 } }
  - assert: { count: { of: 'model\.layers\.\d+\.self_attn\.o_proj\.weight', is: 16 } }
  - assert: { shape: { of: 'model\.layers\.15\.self_attn\.v_proj\.weight', is: [1920, 2048] } }
  - assert: { shape: { of: 'model\.layers\.15\.self_attn\.o_proj\.weight', is: [2048, 1920] } }
