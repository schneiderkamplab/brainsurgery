  - concat: { from: ['model\.layers\.3\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.3\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.3.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.4\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.4\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.4.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.4\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.4\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.4.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.4\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.4\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.4.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.4\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.4\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.4.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.5\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.5\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.5.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.5\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.5\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.5.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.5\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.5\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.5.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.5\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.5\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.5.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.6\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.6\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.6.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.6\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.6\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.6.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.6\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.6\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.6.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.6\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.6\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.6.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.7\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.7\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.7.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.7\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.7\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.7.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.7\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.7\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.7.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.7\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.7\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.7.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.8\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.8\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.8.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.8\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.8\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.8.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.8\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.8\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.8.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.8\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.8\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.8.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.9\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.9\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.9.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.9\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.9\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.9.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.9\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.9\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.9.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.9\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.9\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.9.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.10\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.10\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.10.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.10\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.10\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.10.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.10\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.10\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.10.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.10\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.10\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.10.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.11\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.11\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.11.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.11\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.11\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.11.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.11\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.11\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.11.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.11\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.11\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.11.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.12\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.12\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.12.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.12\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.12\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.12.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.12\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.12\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.12.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.12\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.12\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.12.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.13\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.13\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.13.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.13\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.13\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.13.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.13\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.13\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.13.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.13\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.13\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.13.self_attn.o_proj.pruned, dim: 1 }
  - concat: { from: ['model\.layers\.14\.self_attn\.q_proj\.weight::[:640, :]', 'model\.layers\.14\.self_attn\.q_proj\.weight::[768:, :]'], to: model.layers.14.self_attn.q_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.14\.self_attn\.k_proj\.weight::[:640, :]', 'model\.layers\.14\.self_attn\.k_proj\.weight::[768:, :]'], to: model.layers.14.self_attn.k_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.14\.self_attn\.v_proj\.weight::[:640, :]', 'model\.layers\.14\.self_attn\.v_proj\.weight::[768:, :]'], to: model.layers.14.self_attn.v_proj.pruned, dim: 0 }
  - concat: { from: ['model\.layers\.14\.self_attn\.o_proj\.weight::[:, :640]', 'model\.layers\.14\.self_attn\.o_proj\.weight::[:, 768:]'], to: model.layers.14.self_attn.o_proj.pruned, dim: 1 }
