transforms:
- assert:
    count:
      of: base::.+
      is: 114
- assert:
    count:
      of: ft1::.+
      is: 114
- assert:
    count:
      of: ft2::.+
      is: 114
- assert:
    count:
      of: base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    count:
      of: ft1::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    count:
      of: ft2::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    count:
      of: base::(?!model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight$).+
      is: 66
- assert:
    equal:
      left: base::(?!model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight$).+
      right: ft1::\g<0>
- assert:
    equal:
      left: base::(?!model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight$).+
      right: ft2::\g<0>
- assert:
    dtype:
      of: base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
      is: float32
- copy:
    from: ft1::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight
    to: base::tv1.\1.\2
- subtract_:
    from: base::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight
    to: base::tv1.\1.\2
- copy:
    from: ft2::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight
    to: base::tv2.\1.\2
- subtract_:
    from: base::model\.layers\.(\d+)\.mlp\.(gate_proj|up_proj|down_proj)\.weight
    to: base::tv2.\1.\2
- assert:
    count:
      of: base::tv1\.\d+\.(gate_proj|up_proj|down_proj)
      is: 48
- assert:
    count:
      of: base::tv2\.\d+\.(gate_proj|up_proj|down_proj)
      is: 48
- scale_:
    target: base::tv[12]\.\d+\.(gate_proj|up_proj|down_proj)
    by: 0.4
- add_:
    from: base::tv1\.(\d+)\.(gate_proj|up_proj|down_proj)
    to: base::model.layers.\1.mlp.\2.weight
- add_:
    from: base::tv2\.(\d+)\.(gate_proj|up_proj|down_proj)
    to: base::model.layers.\1.mlp.\2.weight
- delete:
    target: base::tv[12]\.\d+\.(gate_proj|up_proj|down_proj)
- assert:
    not:
      exists: base::tv[12]\..*
- assert:
    count:
      of: base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
      is: 48
- assert:
    count:
      of: base::.+
      is: 114
- assert:
    dtype:
      of: base::model\.layers\.\d+\.mlp\.(gate_proj|up_proj|down_proj)\.weight
      is: float32
- assert:
    equal:
      left: base::(?!model\.layers\.\d+\.mlp\.(?:gate_proj|up_proj|down_proj)\.weight$).+
      right: ft1::\g<0>
