inputs:
  - model::out/T3
transforms:
  - assert: { count: { of: '.*', is: 148 } }
  - assert: { count: { of: '(?!h\.\d+\.(attn\.c_attn|attn\.c_proj|mlp\.c_fc|mlp\.c_proj)\.weight$).*', is: 100 } }
  - assert: { dtype: { of: '(?!h\.\d+\.(attn\.c_attn|attn\.c_proj|mlp\.c_fc|mlp\.c_proj)\.weight$).*', is: float32 } }
  - assert: { dtype: { of: 'h\.\d+\.(attn\.c_attn|attn\.c_proj|mlp\.c_fc|mlp\.c_proj)\.weight', is: bfloat16 } }
  - assert: { not: { exists: 'h\.\d+\.attn\.bias' } }
  - dump: { target: 'h\.0\..*|wte.*|wpe.*', format: compact }
