        - 'h\.8\.attn\.c_attn\.bias::[1920:2304]'
      to: pruned.h.8.attn.c_attn.bias
      dim: 0
  - concat:
      from:
        - 'h\.8\.attn\.c_proj\.weight::[0:320, :]'
