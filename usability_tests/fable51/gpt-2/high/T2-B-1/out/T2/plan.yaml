        - 'h\.2\.attn\.c_attn\.weight::[:, 384:768]'
        - 'h\.2\.attn\.c_attn\.weight::[:, 768:1088]'
        - 'h\.2\.attn\.c_attn\.weight::[:, 1152:1536]'
        - 'h\.2\.attn\.c_attn\.weight::[:, 1536:1856]'
        - 'h\.2\.attn\.c_attn\.weight::[:, 1920:2304]'
