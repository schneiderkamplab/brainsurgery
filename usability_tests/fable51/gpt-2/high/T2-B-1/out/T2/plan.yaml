  - assert: { shape: { of: 'pruned\.h\.11\.attn\.c_proj\.weight', is: [704, 768] } }

  # Replace the originals with the pruned tensors under the original names.
  # The regex is anchored on `attn.` so mlp.c_proj.weight is not touched.
  - delete: { target: 'h\.\d+\.attn\.c_attn\.(weight|bias)' }
  - delete: { target: 'h\.\d+\.attn\.c_proj\.weight' }
  - move:
      from: 'pruned\.(h\.\d+\.attn\.(?:c_attn\.(?:weight|bias)|c_proj\.weight))'
      to: '\1'

  # Required checks (TASK.md), evaluated before the output is written.
  - assert: { shape: { of: 'h\.0\.attn\.c_attn\.weight', is: [768, 2112] } }
  - assert: { shape: { of: 'h\.0\.attn\.c_attn\.bias', is: [2112] } }
  - assert: { shape: { of: 'h\.0\.attn\.c_proj\.weight', is: [704, 768] } }
  - assert: { count: { of: 'model::.*', is: 160 } }
  # Extra guards: no temporaries left, untouched tensors keep their shapes.
  - assert: { not: { exists: 'pruned\..*' } }
  - assert: { count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 12 } }
  - assert: { shape: { of: 'h\.0\.attn\.c_proj\.bias', is: [768] } }
  - assert: { shape: { of: 'h\.0\.attn\.bias', is: [1, 1, 1024, 1024] } }
  - assert: { shape: { of: 'h\.0\.mlp\.c_proj\.weight', is: [3072, 768] } }

output:
  path: out/T2/model.safetensors
  format: safetensors
