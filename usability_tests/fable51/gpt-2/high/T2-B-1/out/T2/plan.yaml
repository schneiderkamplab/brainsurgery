        - 'h\.6\.attn\.c_attn\.weight::[:, 384:768]'
        - 'h\.6\.attn\.c_attn\.weight::[:, 768:1088]'
        - 'h\.6\.attn\.c_attn\.weight::[:, 1152:1536]'
