# T2: prune attention head 5 (of 12, 64 dims each) from every GPT-2 layer.
# Conv1D layout: c_attn.weight is [in=768, out=2304] with columns [q | k | v],
# each 768-wide segment split into 12 head blocks of 64. c_proj.weight is
# [in=768, out=768] with heads as row blocks. Head 5 occupies 320..383 in
# each segment. Per layer we concat the kept slices into a temporary
# `pruned.*` tensor, delete the originals, then move the pruned tensors back
# to their original names.
inputs:
  - model::inputs/base/model.safetensors

transforms:
  # Sanity checks on the input layout before editing.
  - assert: { count: { of: 'model::.*', is: 160 } }
  - assert: { count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 12 } }
  - assert: { count: { of: 'h\.\d+\.attn\.c_attn\.bias', is: 12 } }
  - assert: { count: { of: 'h\.\d+\.attn\.c_proj\.weight', is: 12 } }
  - assert: { shape: { of: 'h\.0\.attn\.c_attn\.weight', is: [768, 2304] } }
  - assert: { shape: { of: 'h\.0\.attn\.c_attn\.bias', is: [2304] } }
  - assert: { shape: { of: 'h\.0\.attn\.c_proj\.weight', is: [768, 768] } }

  # ---- layer 0 ----
  - concat:
      from:
        - 'h\.0\.attn\.c_attn\.weight::[:, 0:320]'
        - 'h\.0\.attn\.c_attn\.weight::[:, 384:768]'
        - 'h\.0\.attn\.c_attn\.weight::[:, 768:1088]'
        - 'h\.0\.attn\.c_attn\.weight::[:, 1152:1536]'
        - 'h\.0\.attn\.c_attn\.weight::[:, 1536:1856]'
        - 'h\.0\.attn\.c_attn\.weight::[:, 1920:2304]'
      to: pruned.h.0.attn.c_attn.weight
      dim: 1
  - concat:
      from:
        - 'h\.0\.attn\.c_attn\.bias::[0:320]'
        - 'h\.0\.attn\.c_attn\.bias::[384:768]'
        - 'h\.0\.attn\.c_attn\.bias::[768:1088]'
        - 'h\.0\.attn\.c_attn\.bias::[1152:1536]'
        - 'h\.0\.attn\.c_attn\.bias::[1536:1856]'
        - 'h\.0\.attn\.c_attn\.bias::[1920:2304]'
      to: pruned.h.0.attn.c_attn.bias
      dim: 0
  - concat:
      from:
        - 'h\.0\.attn\.c_proj\.weight::[0:320, :]'
        - 'h\.0\.attn\.c_proj\.weight::[384:768, :]'
      to: pruned.h.0.attn.c_proj.weight
      dim: 0
  - assert: { shape: { of: 'pruned\.h\.0\.attn\.c_attn\.weight', is: [768, 2112] } }
  - assert: { shape: { of: 'pruned\.h\.0\.attn\.c_attn\.bias', is: [2112] } }
  - assert: { shape: { of: 'pruned\.h\.0\.attn\.c_proj\.weight', is: [704, 768] } }

  # ---- layer 1 ----
  - concat:
      from:
        - 'h\.1\.attn\.c_attn\.weight::[:, 0:320]'
        - 'h\.1\.attn\.c_attn\.weight::[:, 384:768]'
        - 'h\.1\.attn\.c_attn\.weight::[:, 768:1088]'
        - 'h\.1\.attn\.c_attn\.weight::[:, 1152:1536]'
        - 'h\.1\.attn\.c_attn\.weight::[:, 1536:1856]'
        - 'h\.1\.attn\.c_attn\.weight::[:, 1920:2304]'
      to: pruned.h.1.attn.c_attn.weight
      dim: 1
  - concat:
      from:
        - 'h\.1\.attn\.c_attn\.bias::[0:320]'
        - 'h\.1\.attn\.c_attn\.bias::[384:768]'
        - 'h\.1\.attn\.c_attn\.bias::[768:1088]'
        - 'h\.1\.attn\.c_attn\.bias::[1152:1536]'
        - 'h\.1\.attn\.c_attn\.bias::[1536:1856]'
        - 'h\.1\.attn\.c_attn\.bias::[1920:2304]'
      to: pruned.h.1.attn.c_attn.bias
