inputs:
  - model::inputs/base/model.safetensors

transforms:
  # Sanity: 12 blocks and 160 tensors on input.
  - assert: { count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 12 } }
  - assert: { count: { of: '.*', is: 160 } }

  # 1. Remove blocks 2, 5, 8 entirely.
  - delete: { target: 'h\.(2|5|8)\..*' }
  - assert: { not: { exists: 'h\.(2|5|8)\..*' } }

  # 2. Renumber survivors in ascending order (each destination index is
  #    already vacant, so no collision is possible).
  - move: { from: 'h\.3\.(.+)', to: 'h.2.\1' }
  - move: { from: 'h\.4\.(.+)', to: 'h.3.\1' }
  - move: { from: 'h\.6\.(.+)', to: 'h.4.\1' }
  - move: { from: 'h\.7\.(.+)', to: 'h.5.\1' }
  - move: { from: 'h\.9\.(.+)', to: 'h.6.\1' }
  - move: { from: 'h\.10\.(.+)', to: 'h.7.\1' }
  - move: { from: 'h\.11\.(.+)', to: 'h.8.\1' }

  # Required checks.
  - assert: { not: { exists: 'h\.(9|10|11)\..*' } }
  - assert: { count: { of: 'h\.\d+\.attn\.c_attn\.weight', is: 9 } }
  - assert: { count: { of: 'h\.[0-8]\..*', is: 117 } }
  - assert: { count: { of: '.*', is: 121 } }

output:
  path: out/T1/model.safetensors
  format: safetensors
