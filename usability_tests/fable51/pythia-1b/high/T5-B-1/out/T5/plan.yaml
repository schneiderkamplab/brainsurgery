# T5: merge a PEFT LoRA adapter (r=16, alpha=32, fan_in_fan_out=false) into
# Pythia-1B query_key_value weights and export a sharded checkpoint.
inputs:
  - base::inputs/base/model.safetensors
  - lora::inputs/lora/adapter_model.safetensors

transforms:
  # --- required check: exactly 16 adapter pairs present ---
  - assert:
      all:
        - count: { of: 'lora::.*\.lora_A\.weight', is: 16 }
        - count: { of: 'lora::.*\.lora_B\.weight', is: 16 }
        - count: { of: 'lora::.*', is: 32 }
        - count: { of: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', is: 16 }

  # delta_i = B_i @ A_i  (float32, shape [6144, 2048]); lands as an intermediate on the base alias
  - matmul:
      from_a: 'lora::base_model\.model\.(gpt_neox\.layers\.\d+\.attention\.query_key_value)\.lora_B\.weight'
      from_b: 'lora::base_model.model.\1.lora_A.weight'
      to: 'base::\1.lora_delta'

  # exactly 16 deltas were produced, each with the base weight's shape
  - assert: { count: { of: 'base::.*\.lora_delta', is: 16 } }
  - assert: { shape: { of: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.lora_delta', is: [6144, 2048] } }
  - assert: { dtype: { of: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.lora_delta', is: float32 } }

  # scale = lora_alpha / r = 32 / 16 = 2
  - scale_: { target: 'base::.*\.lora_delta', by: 2.0 }

  # W <- float32(W) + scale * B @ A, then back to float16
  - cast_: { target: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', to: float32 }
  - add_:
      from: 'base::(gpt_neox\.layers\.\d+\.attention\.query_key_value)\.lora_delta'
      to: 'base::\1.weight'
  - cast_: { target: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', to: float16 }

  # drop the intermediates
  - delete: { target: 'base::.*\.lora_delta' }

  # --- required checks before writing ---
  - assert: { not: { exists: 'base::.*lora_.*' } }
  - assert: { shape: { of: 'base::gpt_neox\.layers\.0\.attention\.query_key_value\.weight', is: [6144, 2048] } }
  - assert: { dtype: { of: 'base::gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', is: float16 } }
  - assert: { count: { of: 'base::.*', is: 244 } }

output:
  path: out/T5
  format: safetensors
  shard: 512MB
