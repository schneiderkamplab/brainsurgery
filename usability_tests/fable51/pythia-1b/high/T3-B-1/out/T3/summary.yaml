transforms:
- assert:
    count:
      of: gpt_neox\.layers\.\d+\.attention\.(bias|masked_bias|rotary_emb\.inv_freq)
      is: 48
- delete:
    target: gpt_neox\.layers\.\d+\.attention\.(bias|masked_bias|rotary_emb\.inv_freq)
- cast_:
    target: .*
    to: float32
- assert:
    count:
      of: gpt_neox\.layers\.\d+\.(attention\.(query_key_value|dense)|mlp\.dense_(h_to_4h|4h_to_h))\.weight
      is: 64
- cast_:
    target: gpt_neox\.layers\.\d+\.(attention\.(query_key_value|dense)|mlp\.dense_(h_to_4h|4h_to_h))\.weight
    to: bfloat16
- assert:
    all:
    - count:
        of: gpt_neox\.layers\.\d+\.(attention\.(query_key_value|dense)|mlp\.dense_(h_to_4h|4h_to_h))\.weight
        is: 64
    - dtype:
        of: gpt_neox\.layers\.\d+\.(attention\.(query_key_value|dense)|mlp\.dense_(h_to_4h|4h_to_h))\.weight
        is: bfloat16
    - count:
        of: (?!gpt_neox\.layers\.\d+\.(attention\.(query_key_value|dense)|mlp\.dense_(h_to_4h|4h_to_h))\.weight$).*
        is: 132
    - dtype:
        of: (?!gpt_neox\.layers\.\d+\.(attention\.(query_key_value|dense)|mlp\.dense_(h_to_4h|4h_to_h))\.weight$).*
        is: float32
    - dtype:
        of: gpt_neox\.layers\.0\.attention\.query_key_value\.weight
        is: bfloat16
    - dtype:
        of: gpt_neox\.embed_in\.weight
        is: float32
    - dtype:
        of: embed_out\.weight
        is: float32
    - count:
        of: .*
        is: 196
    - not:
        exists: gpt_neox\.layers\.\d+\.attention\.(bias|masked_bias|rotary_emb\.inv_freq)
