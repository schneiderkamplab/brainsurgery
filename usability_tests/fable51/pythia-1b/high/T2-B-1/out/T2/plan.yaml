# T2: prune attention head 5 from every layer of Pythia-1B.
# Fused query_key_value rows are interleaved per head (768 rows each: q|k|v),
# so head 5 owns rows 3840..4607; dense.weight columns 1280..1535.
inputs:
  - model::inputs/base/model.safetensors

output:
  path: out/T2/model.safetensors
  format: safetensors

transforms:
  # Preflight: original layout.
  - assert: { count: { of: '.*', is: 244 } }
  - assert: { shape: { of: 'gpt_neox\.layers\.0\.attention\.query_key_value\.weight', is: [6144, 2048] } }
  - assert: { shape: { of: 'gpt_neox\.layers\.0\.attention\.query_key_value\.bias', is: [6144] } }
  - assert: { shape: { of: 'gpt_neox\.layers\.0\.attention\.dense\.weight', is: [2048, 2048] } }
  - assert: { count: { of: 'gpt_neox\.layers\.\d+\.attention\.query_key_value\.weight', is: 16 } }

  # Build pruned tensors under temporary names (concat needs one tensor per source ref).
  - concat:
      from: ['gpt_neox\.layers\.0\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.0\.attention\.query_key_value\.weight::[4608:]']
      to: pruned.layers.0.attention.query_key_value.weight
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.0\.attention\.query_key_value\.bias::[:3840]', 'gpt_neox\.layers\.0\.attention\.query_key_value\.bias::[4608:]']
      to: pruned.layers.0.attention.query_key_value.bias
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.0\.attention\.dense\.weight::[:, :1280]', 'gpt_neox\.layers\.0\.attention\.dense\.weight::[:, 1536:]']
      to: pruned.layers.0.attention.dense.weight
      dim: 1
  - concat:
      from: ['gpt_neox\.layers\.1\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.1\.attention\.query_key_value\.weight::[4608:]']
      to: pruned.layers.1.attention.query_key_value.weight
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.1\.attention\.query_key_value\.bias::[:3840]', 'gpt_neox\.layers\.1\.attention\.query_key_value\.bias::[4608:]']
      to: pruned.layers.1.attention.query_key_value.bias
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.1\.attention\.dense\.weight::[:, :1280]', 'gpt_neox\.layers\.1\.attention\.dense\.weight::[:, 1536:]']
      to: pruned.layers.1.attention.dense.weight
      dim: 1
  - concat:
      from: ['gpt_neox\.layers\.2\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.2\.attention\.query_key_value\.weight::[4608:]']
      to: pruned.layers.2.attention.query_key_value.weight
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.2\.attention\.query_key_value\.bias::[:3840]', 'gpt_neox\.layers\.2\.attention\.query_key_value\.bias::[4608:]']
      to: pruned.layers.2.attention.query_key_value.bias
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.2\.attention\.dense\.weight::[:, :1280]', 'gpt_neox\.layers\.2\.attention\.dense\.weight::[:, 1536:]']
      to: pruned.layers.2.attention.dense.weight
      dim: 1
  - concat:
      from: ['gpt_neox\.layers\.3\.attention\.query_key_value\.weight::[:3840]', 'gpt_neox\.layers\.3\.attention\.query_key_value\.weight::[4608:]']
      to: pruned.layers.3.attention.query_key_value.weight
      dim: 0
  - concat:
      from: ['gpt_neox\.layers\.3\.attention\.query_key_value\.bias::[:3840]', 'gpt_neox\.layers\.3\.attention\.query_key_value\.bias::[4608:]']
