inputs:
  - models/gpt2/model.safetensors
output: { path: models/test, shard: 100MB }
transforms:
  - help: diff
  - prefixes: { mode: list }
  # - exit: {}  # Example only: would stop execution here.
  - dump: { target: ["*all"], format: tree }
  - dump: { target: ["*all"], format: json }
  - dump: { target: ["*all"], format: compact}
  - copy: { from: ln_f.weight, to: ln_f_copy.weight }
  - move: { from: ^h(.*), to: i\1 }
  - move: { from: [i, "*rest"], to: [h, "*rest"] }
  - assign: { from: ln_f_copy.weight, to: ln_f.weight }
  - scale: { from: ln_f_copy.weight, to: ln_f_scaled_equal.weight, by: 1.0 }
  - assert: { equal: { left: ln_f.weight, right: ln_f_scaled_equal.weight } }
  - scale: { from: ln_f_copy.weight, to: ln_f_scaled_half.weight, by: 0.5 }
  - assert: { not: { equal: { left: ln_f.weight, right: ln_f_scaled_half.weight } } }
  - copy: { from: "ln_f_copy.weight::[:8]", to: demo.x }
  - copy: { from: "ln_f_copy.weight::[:8]", to: demo.y }
  - scale_: { target: demo.y, by: 2.0 }
  - copy: { from: demo.x, to: demo.sum }
  - copy: { from: demo.x, to: demo.diff }
  - copy: { from: demo.x, to: demo.prod }
  - add: { from_a: demo.x, from_b: demo.x, to: demo.sum }
  - assert: { equal: { left: demo.sum, right: demo.y } }
  - subtract: { from_a: demo.sum, from_b: demo.x, to: demo.diff }
  - assert: { equal: { left: demo.diff, right: demo.x } }
  - multiply: { from_a: demo.x, from_b: demo.x, to: demo.prod }
  - add_: { from: demo.x, to: demo.diff }
  - assert: { equal: { left: demo.diff, right: demo.y } }
  - subtract_: { from: demo.x, to: demo.diff }
  - assert: { equal: { left: demo.diff, right: demo.x } }
  - fill: { from: demo.x, to: demo.filled, mode: constant, value: 1.0 }
  - fill_: { target: demo.filled, mode: tensor, values: [0, 1, 2, 3, 4, 5, 6, 7] }
  - clamp: { from: demo.filled, to: demo.clamped, min: 2.0, max: 5.0 }
  - clamp_: { target: demo.clamped, min: 3.0, max: 4.0 }
  - cast: { from: demo.clamped, to: demo.clamped_cast, dtype: float16 }
  - cast_: { target: demo.clamped_cast, to: float32 }
  - split: { from: demo.clamped, to: [demo.clamped_left, demo.clamped_right], sizes: [4, 4] }
  - reshape: { from: demo.clamped, to: demo.clamped_2d, shape: [2, 4] }
  - reshape_: { target: demo.clamped_2d, shape: [4, 2] }
  - permute: { from: demo.clamped_2d, to: demo.clamped_perm, order: [1, 0] }
  - matmul: { from_a: demo.clamped_2d, from_b: demo.clamped_perm, to: demo.matmul }
  - diff: { left: "demo.clamped::[:4]", right: "demo.clamped::[4:]" }
  - copy: { from: "wte.weight::[:64,:]", to: demo.lm_head.sample }
  - copy: { from: "demo.lm_head.sample::[:32,:]", to: demo.lm_head.part0 }
  - copy: { from: "demo.lm_head.sample::[32:,:]", to: demo.lm_head.part1 }
  - concat: { from: [demo.lm_head.part0, demo.lm_head.part1], to: demo.lm_head.rebuilt, dim: 0 }
  - assert: { equal: { left: demo.lm_head.rebuilt, right: demo.lm_head.sample } }
  - copy: { from: "h.0.attn.c_proj.weight::[:4,:4]", to: demo.matrix.weight }
  - phlora_: { target: demo.matrix.weight, rank: 2 }
  - copy: { from: demo.matrix.weight, to: demo.matrix.split_source.weight }
  - phlora: { target: demo.matrix.split_source.weight, target_a: demo.matrix.a.weight, target_b: demo.matrix.b.weight, rank: 2 }
  - assert: { shape: { of: demo.matrix.weight, is: [4, 4] } }
  - assert: { shape: { of: demo.matrix.a.weight, is: [2, 4] } }
  - assert: { shape: { of: demo.matrix.b.weight, is: [4, 2] } }
  - assert: { not: { iszero: demo.matrix.a.weight } }
  - assert: { not: { iszero: demo.matrix.b.weight } }
  - assert: { not: { iszero: demo.matrix.weight } }
  - copy: { from: "h.0.attn.c_proj.weight::[:1,:1]", to: demo.scalar.source.weight }
  - copy: { from: demo.scalar.source.weight, to: demo.scalar.phlora_inplace.weight }
  - phlora_: { target: demo.scalar.phlora_inplace.weight, rank: 1 }
  - phlora: { target: demo.scalar.source.weight, target_a: demo.scalar.a.weight, target_b: demo.scalar.b.weight, rank: 1 }
  - assert: { shape: { of: demo.scalar.a.weight, is: [1, 1] } }
  - assert: { shape: { of: demo.scalar.b.weight, is: [1, 1] } }
  - copy: { from: demo.scalar.phlora_inplace.weight, to: demo.scalar.reconstructed.weight }
  - multiply: { from_a: demo.scalar.b.weight, from_b: demo.scalar.a.weight, to: demo.scalar.reconstructed.weight }
  - assert: { equal: { left: demo.scalar.reconstructed.weight, right: demo.scalar.phlora_inplace.weight, eps: 0.000001 } }
  - save: { path: /tmp/brainsurgery_demo_x.safetensors, target: demo.x }
  - load: { path: /tmp/brainsurgery_demo_x.safetensors, to: demo.x_loaded, format: safetensors }
  - assert: { equal: { left: demo.x_loaded, right: demo.x } }
  # Tokenizer encode/decode + generation demo.
  - load: { path: examples/gpt2.axon, backend: axon, alias: model }
  - encode: { text: "Eat my shorts, Harold!", to: demo.prompt_ids, tokenizer: models/gpt2 }
  - reshape: { from: demo.prompt_ids, to: demo.prompt_ids_batched, shape: [1, -1] }
  - generate:
      model: model
      runtime: synapse
      input_ids: demo.prompt_ids_batched
      max_new_tokens: 16
      output: demo.generated_ids
  - decode: { from: demo.generated_ids, tokenizer: models/gpt2 }
  - encode:
      text: "Eat my shorts, Harold! I'm going to get you out of here!\"\n\n\"I'm sorry"
      to: demo.expected_generated_ids
      tokenizer: models/gpt2
  - reshape: { from: demo.expected_generated_ids, to: demo.expected_generated_ids_batched, shape: [1, -1] }
  - assert: { equal: { left: demo.generated_ids, right: demo.expected_generated_ids_batched } }
  # Compare infer outputs across synapse runtime, codegen runtime, and HF runtime.
  - load: { path: models/gpt2.old, alias: model_hf }
  - infer:
      model: model
      runtime: synapse
      input_ids: model::demo.prompt_ids_batched
      output: demo.logits_synapse
  - infer:
      model: model
      runtime: codegen
      input_ids: model::demo.prompt_ids_batched
      output: demo.logits_codegen
  - infer:
      model: model_hf
      runtime: hf
      input_ids: model::demo.prompt_ids_batched
      output: demo.logits_hf
  - assert: { equal: { left: model::demo.logits_synapse, right: model::demo.logits_codegen, eps: 0.0005 } }
  - assert: { equal: { left: model::demo.logits_synapse, right: model_hf::demo.logits_hf, eps: 0.0005 } }
  - assert: { equal: { left: model::demo.logits_codegen, right: model_hf::demo.logits_hf, eps: 0.0005 } }
  - cast_: { target: ln_f_copy.weight, to: int64 }
  - delete: { target: ln_f_copy.weight }
  - delete: { target: ln_f_scaled_equal.weight }
  - delete: { target: ln_f_scaled_half.weight }
  - delete: { target: demo.x }
  - delete: { target: demo.y }
  - delete: { target: demo.sum }
  - delete: { target: demo.diff }
  - delete: { target: demo.prod }
  - delete: { target: demo.filled }
  - delete: { target: demo.clamped }
  - delete: { target: demo.clamped_cast }
  - delete: { target: demo.clamped_left }
  - delete: { target: demo.clamped_right }
  - delete: { target: demo.clamped_2d }
  - delete: { target: demo.clamped_perm }
  - delete: { target: demo.matmul }
  - delete: { target: demo.lm_head.sample }
  - delete: { target: demo.lm_head.part0 }
  - delete: { target: demo.lm_head.part1 }
  - delete: { target: demo.lm_head.rebuilt }
  - delete: { target: demo.matrix.weight }
  - delete: { target: demo.matrix.a.weight }
  - delete: { target: demo.matrix.b.weight }
  - delete: { target: demo.scalar.a.weight }
  - delete: { target: demo.scalar.b.weight }
  - delete: { target: demo.scalar.phlora_inplace.weight }
  - delete: { target: demo.scalar.reconstructed.weight }
  - delete: { target: demo.x_loaded }
  - delete: { target: demo.prompt_ids }
  - delete: { target: demo.prompt_ids_batched }
  - delete: { target: demo.generated_ids }
  - delete: { target: demo.expected_generated_ids }
  - delete: { target: demo.expected_generated_ids_batched }
  - delete: { target: model::demo.logits_synapse }
  - delete: { target: model::demo.logits_codegen }
  - delete: { target: 'model_hf::(.+)' }
  - load: { path: models/gpt2/model.safetensors, alias: orig }
  - assert: { equal: { left: '(.+)', right: 'orig::\1' } }
  - assert: { equal: { left: 'orig::(.+)', right: '\1' } }
  - delete: { target: 'orig::(.+)' }
