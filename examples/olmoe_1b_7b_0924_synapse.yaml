synapse: 1
model:
  inputs:
    input_ids:
      optional: false
    attn_mask:
      optional: true
    past_kv:
      optional: true
    use_cache:
      optional: true
  graph:
  - n_call_2:
      _op: call
      _target: Cache.past_length
      _args: past_kv
      _bind: kwarg_1
  - n_op_3:
      _op: position_ids
      _bind: pos_ids
      _args:
      - input_ids
      - attn_mask
      past_length: kwarg_1
  - n_op_4:
      _op: embedding
      _bind: x
      _args: input_ids
      dim: D
      _params:
        weight: model.embed_tokens.weight
  - n_op_5:
      _op: select
      _bind: new_kv
      cond: use_cache
      _then_bind: then_new_kv
      _else_bind: else_new_kv
      _then:
      - n_op_5_then:
          _op: list_init
          _bind: then_new_kv
      _else:
      - n_op_5_else:
          _op: _ir_const
          value: null
          _bind: else_new_kv
  - n_for_10:
      _op: for
      _scope: model.layers
      _var: i
      _to: L
      _body:
      - n_op_7:
          _op: list_index
          _bind: past_i
          _args:
          - past_kv
          - i
      - n_call_8:
          _op: call
          _target: olmoe_decoder_block
          _args:
          - x
          - pos_ids
          - attn_mask
          - past_i
          _bind:
          - x
          - new_i
      - n_op_9:
          _op: list_append
          _bind: new_kv
          _args:
          - new_kv
          - new_i
  - n_call_11:
      _op: rmsnorm
      _bind: x
      _args: x
      eps: EPS
      dim: D
      _params:
        weight: model.norm.weight
  - n_op_12:
      _op: linear
      _bind: logits
      _args: x
      _params:
        weight: lm_head.weight
  outputs:
    logits: logits
    new_kv: new_kv
  symbols:
    D: 2048
    V: 50304
    L: 16
    H: 16
    HD: 128
    E: 64
    EPT: 8
    C: 4096
    EPS: 1.0e-05
    THETA: 10000.0
    ATTN_SCALE: 0.08838834764831845
    B: null
    S: null
  blocks:
    Cache.past_length:
      inputs:
        cache:
          optional: true
      graph:
      - n_op_1:
          _op: list_index
          _bind: first
          _args:
          - cache
          - '0'
      - n_op_2:
          _op: cache_seq_len
          _bind: out_0
          _args: first
      outputs:
        out_0: out_0
    expert_ffn:
      inputs:
        x:
          optional: false
      graph:
      - n_op_1:
          _op: linear
          _bind: gate
          _args: x
          _params:
            weight: gate_proj.weight
      - n_op_2:
          _op: linear
          _bind: up
          _args: x
          _params:
            weight: up_proj.weight
      - n_op_4:
          _op: activations_silu
          _bind: pipe_3
          _args: gate
      - n_op_6:
          _op: mul
          _bind: pipe_5
          _args:
          - pipe_3
          - up
      - n_op_7:
          _op: linear
          _bind: out_0
          _args: pipe_5
          dim: D
          _params:
            weight: down_proj.weight
      outputs:
        out_0: out_0
    olmoe_decoder_block:
      inputs:
        x:
          optional: false
        pos_ids:
          optional: false
        attn_mask:
          optional: true
        past_kv:
          optional: true
      graph:
      - n_call_1:
          _op: rmsnorm
          _bind: x_norm
          _args: x
          eps: EPS
          dim: D
          _params:
            weight: input_layernorm.weight
      - n_op_3:
          _op: linear
          _bind: pipe_2
          _args: x_norm
          dim: D
          _params:
            weight: self_attn.q_proj.weight
      - n_call_5:
          _op: rmsnorm
          _bind: pipe_4
          _args: pipe_2
          eps: EPS
          dim: D
          _params:
            weight: self_attn.q_norm.weight
      - n_op_6:
          _op: reshape_heads
          _bind: q
          _args: pipe_4
          heads: H
      - n_op_8:
          _op: linear
          _bind: pipe_7
          _args: x_norm
          dim: D
          _params:
            weight: self_attn.k_proj.weight
      - n_call_10:
          _op: rmsnorm
          _bind: pipe_9
          _args: pipe_7
          eps: EPS
          dim: D
          _params:
            weight: self_attn.k_norm.weight
      - n_op_11:
          _op: reshape_heads
          _bind: k
          _args: pipe_9
          heads: H
      - n_op_13:
          _op: linear
          _bind: pipe_12
          _args: x_norm
          dim: D
          _params:
            weight: self_attn.v_proj.weight
      - n_op_14:
          _op: reshape_heads
          _bind: v
          _args: pipe_12
          heads: H
      - n_op_15:
          _op: rope_pair
          _bind:
          - qr
          - kr
          _args:
          - q
          - k
          position_ids: pos_ids
          theta: THETA
      - n_op_16:
          _op: cache_update
          _bind:
          - k_ctx
          - v_ctx
          - new_kv
          _args:
          - past_kv
          - kr
          - v
      - n_op_17:
          _op: causal_mask
          _bind: mask
          _args:
          - qr
          - k_ctx
          window: C
          padding_mask: attn_mask
      - n_op_19:
          _op: attention
          _bind: pipe_18
          _args:
          - qr
          - k_ctx
          - v_ctx
          mask: mask
          scale: ATTN_SCALE
      - n_op_20:
          _op: merge_heads
          _bind: a
          _args: pipe_18
      - n_op_21:
          _op: linear
          _bind: a
          _args: a
          dim: D
          _params:
            weight: self_attn.o_proj.weight
      - n_op_22:
          _op: add
          _bind: x
          _args:
          - x
          - a
      - n_call_23:
          _op: rmsnorm
          _bind: xn
          _args: x
          eps: EPS
          dim: D
          _params:
            weight: post_attention_layernorm.weight
      - n_op_25:
          _op: linear
          _bind: pipe_24
          _args: xn
          dim: E
          _params:
            weight: mlp.gate.weight
      - n_op_27:
          _op: softmax
          _bind: pipe_26
          _args: pipe_24
          dim: -1
          dtype: float32
      - n_op_28:
          _op: topk
          _bind:
          - topk_scores
          - topk_indices
          _args: pipe_26
          k: EPT
          dim: -1
      - n_op_29:
          _op: zeros_like
          _bind: m
          _args: xn
      - n_for_33:
          _op: for
          _scope: mlp.experts
          _var: e
          _to: E
          _body:
          - n_op_30:
              _op: moe_select
              _bind:
              - x_sel
              - token_idx
              - topk_pos
              - sel_scores
              _args:
              - xn
              - topk_scores
              - topk_indices
              expert: e
          - n_call_31:
              _op: call
              _target: expert_ffn
              _args: x_sel
              _bind: x_upd
          - n_op_32:
              _op: moe_scatter_add
              _bind: m
              _args:
              - m
              - token_idx
              - x_upd
              - sel_scores
      - n_op_34:
          _op: add
          _bind: out_0
          _args:
          - x
          - m
      outputs:
        out_0: out_0
        new_kv: new_kv
